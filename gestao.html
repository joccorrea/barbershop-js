.hst.conf{background:#DCEBFA;border-color:#5B9BD5;color:#1d5a99}.hst.fin{background:#D9F1E2;border-color:#4DAA75;color:#14683a}.hst.fal{background:#FFE5E5;border-color:#E58A8A;color:#8f1d1d}.hst.at{background:#EADCF8;border-color:#9A6BD1;color:#4B2480}.hst.pen{background:#FFF3CF;border-color:#E3B341;color:#7a5a00}
.pay-tile{position:relative}.pay-tile small{font-size:12px;color:#5b7a99;font-weight:600;margin-top:-2px}
.pay-amts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.pay-amt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #C4DFF8;border-radius:14px;padding:8px 10px 8px 14px;font-weight:700;color:#1F4B75}
.pay-money{display:flex;align-items:center;gap:6px;background:#F3F9FF;border:1px solid #C4DFF8;border-radius:12px;padding:0 10px;height:42px;width:150px}.pay-money i{font-style:normal;color:#5b7a99;font-weight:700}
.pay-money input{border:0!important;background:transparent!important;height:100%!important;width:100%;min-width:0;font-size:18px!important;font-weight:800;color:#10304F;text-align:right;padding:0!important;outline:none}
.pay-money input{box-shadow:none!important;border-radius:0!important}.pay-hint{font-size:13px;color:#5b7a99;margin:8px 2px}
.pay-opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pay-optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #C4DFF8;border-radius:14px;padding:8px 12px;min-height:50px;font-weight:700;color:#1F4B75;font-size:14.5px}
.pay-optrow small{display:block;font-weight:500;color:#5b7a99;font-size:12px}
.pay-optrow input[type=checkbox]{width:24px;height:24px;accent-color:#4F94D8}
.pay-optrow input[type=date]{-webkit-appearance:none;appearance:none;height:38px;border:1px solid #C4DFF8;border-radius:10px;background:#F3F9FF;padding:0 10px;font-size:16px;color:#10304F;display:flex;align-items:center;min-width:0}
.sc-grid{margin:10px 0}
.nsm{position:fixed;inset:0;z-index:6500;background:rgba(10,30,50,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.nsm-card{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto}.nsm-card h3{margin:0 0 4px;font-size:18px;color:#10304F}.nsm-card p{margin:0 0 12px;color:#5b7a99;font-size:14px}
.nsm-card button[data-ns]:not(.ns-x){display:block;width:100%;text-align:left;border:1px solid #C4DFF8;background:#F3F9FF;border-radius:14px;padding:11px 13px;margin-bottom:8px;color:#10304F}.nsm-card button[data-ns] b{display:block;font-size:15px}.nsm-card button[data-ns] span{font-size:12.5px;color:#5b7a99}
.ns-x{width:100%;border:0;background:none;color:#2f6fb0;font-weight:700;font-size:15px;padding:10px}
.cc-credit{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EAF8F4;border:1px solid #9AD6C8;border-radius:14px;padding:10px 13px;margin-bottom:8px;color:#0F5F54}.cc-credit small{display:block;font-size:12px}.cc-credit b{font-size:18px}
.agenda-appointment.status-prepaid-card{background:#D8F3EE!important;border:2px solid #3BAE9C!important;color:#0F5F54!important}.agenda-appointment.status-prepaid-card .agenda-sub{font-weight:700}
input[type=date]{display:flex;align-items:center}input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em;display:flex;align-items:center}

.pay-body{padding-bottom:120px!important}
.pay-edit-banner{background:#EAF4FF;border:1px solid #9CC7F0;color:#1F4B75;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;margin-bottom:10px}
.pay-addprod{width:100%;height:46px;border:1.5px dashed #6FA8DC;background:#F3F9FF;color:#2f6fb0;border-radius:14px;font-weight:800;font-size:15px;margin-top:4px}
.pay-money{margin-left:auto;width:auto!important;min-width:0;padding:0 4px 0 8px!important;background:transparent!important;border:0!important}
.pay-money input{width:96px!important;flex:none;text-align:right!important;background:#F3F9FF!important;border:1px solid #C4DFF8!important;border-radius:10px!important;padding:0 10px!important;height:42px!important}
.pay-amt{padding-right:6px!important}
.slot.lunch{cursor:pointer}.slot-h{font-size:15px!important;margin:10px 2px 6px!important}

.slot-compact select,.slot-compact input{height:38px!important;min-height:0!important;padding:0 8px!important;font-size:16px!important;border-radius:10px!important;border:1px solid #C4DFF8!important;background:#fff!important;width:auto;min-width:0;flex:1 1 90px;max-width:none}
.slot-compact .btn{height:38px!important;min-height:0!important;padding:0 14px!important;border-radius:10px!important;font-size:15px!important}
.slot-compact #period-slot-custom-wrap{flex:1 1 100%;display:flex;align-items:center;gap:8px}
.agenda-paid{color:#1f8a4c}.agenda-meta{flex-wrap:wrap}
.pay-mini{margin-top:6px;padding-top:6px}.pay-mini b{font-size:16px}.pay-diff.warn{color:#C2700A}.agenda-appointment.status-partial-card{background:#FFE9C7!important;border:2px solid #F0A030!important;color:#7A4300!important}.agenda-appointment.status-partial-card .agenda-sub{font-weight:700}

async function enablePushNotifications(){
 if(!session?.access_token)throw Error("Entre na gestão para ativar as notificações.");
 if(!("serviceWorker" in navigator)||!("PushManager" in window))throw Error("Este navegador não oferece suporte a notificações push.");
 const permission=await Notification.requestPermission();
 if(permission!=="granted")throw Error("Permissão de notificações não concedida. Ative nas configurações do iPhone.");
 const reg=await navigator.serviceWorker.register("/barbershop-js/sw.js",{scope:"/barbershop-js/"});
 await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlBytes(PUSH_PUBLIC_KEY)});
 const response=await fetch(PUSH_FUNCTION,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action:"subscribe",subscription:sub.toJSON()})});

}

}

  }else if(block){

function serviceDurationMinutes(service){
 const name=String(service?.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 const thirtyMinuteServices=new Set(["corte simples","degrade na zero","degrade navalhado","degrade na shaver","undercut feminino","corte feminino"]);
 return thirtyMinuteServices.has(name) ? 30*Number(service?.qty||1) : Math.max(0,Number(service?.duration_min||0))*Number(service?.qty||1);
}

function normalizedStatus(status){return String(status||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[ -]+/g,"_")}
function notCancelled(b){return !/cancel/.test(normalizedStatus(b&&b.status))}
function statusPortuguese(status){const s=normalizedStatus(status);return ({cancelled:"Cancelado",canceled:"Cancelado",cancelado:"Cancelado",cancelada:"Cancelado",confirmed:"Confirmado",confirmado:"Confirmado",confirmada:"Confirmado",completed:"Realizado",done:"Realizado",realizado:"Realizado",realizada:"Realizado",concluido:"Realizado",concluida:"Realizado",finalizado:"Finalizado",finalizada:"Finalizado",finalized:"Finalizado",finalised:"Finalizado",atendido:"Realizado",atendida:"Realizado",pending:"Pendente",pendente:"Pendente",no_show:"Não compareceu"})[s]||"Pendente"}

function appointmentCardStatus(status){
 const s=normalizedStatus(status);
 if(["no_show","nao_compareceu","faltou"].includes(s))return "status-noshow-card";
 if(["cancelled","canceled","cancelado","cancelada"].includes(s))return "status-cancelled-card";
 if(["finalizado","finalizada","finalized","finalised"].includes(s))return "status-finalized-card";
 if(["completed","done","realizado","realizada","concluido","concluida","atendido","atendida"].includes(s))return "status-completed-card";

 return "status-pending-card";

function bookingSubtotal(d){return d.services.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||1),0)}
function comboAmount(c,sub){const v=Number(c.discount||0);return Math.max(0,Math.min(sub,c.discount_type==="percent"?Math.round(sub*Math.min(v,100))/100:v))}
function bookingCombo(d){
 const ids=d.services.map(x=>Number(x.id));let best=null;const sub=bookingSubtotal(d);
 (d.combos||[]).filter(c=>c.active).forEach(c=>{
  const groups={};c.items.forEach(i=>{(groups[i.group_no]=groups[i.group_no]||[]).push(Number(i.service_id))});
  const gs=Object.values(groups);
  if(gs.length&&gs.every(g=>g.some(id=>ids.includes(id)))){if(!best||comboAmount(c,sub)>comboAmount(best,sub))best=c}
 });
 return best;
}
function bookingTotals(d){
 const sub=bookingSubtotal(d),combo=bookingCombo(d);
 const comboVal=combo&&!d.comboOff?comboAmount(combo,sub):0;
 const disc=Math.max(0,Number(d.discount||0)),sur=Math.max(0,Number(d.surcharge||0));
 return {sub,combo,comboVal,disc,sur,total:Math.max(0,sub-comboVal-disc+sur)};
}

async function syncClosureAfterEdit(id,p){

      }

  };

  const cats=encodeURIComponent('("Atendimento","Retirada do proprietário","Taxas de cartão","Contas a receber","Caixinha")');
  if(o.keepPaid)await api(`finance_movements?booking_id=eq.${encodeURIComponent(id)}&status=eq.pending&category=eq.Contas a receber`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
  else await api(`finance_movements?booking_id=eq.${encodeURIComponent(id)}&status=in.(paid,pending)&category=in.${cats}`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
  const ds=todayLocal();
  for(const c of cl){
    for(const it of (Array.isArray(c.product_items)?c.product_items:[])){
      const cur=(await api(`finance_products?select=id,stock_quantity&id=eq.${it.product_id}`).catch(()=>[]))[0];
      if(!cur)continue;
      await api(`finance_products?id=eq.${it.product_id}`,{method:"PATCH",body:JSON.stringify({stock_quantity:Number(cur.stock_quantity)+Number(it.quantity),updated_at:new Date().toISOString()})});
      await api("finance_stock_movements",{method:"POST",body:JSON.stringify({product_id:it.product_id,movement_type:"adjustment",quantity:Number(it.quantity),unit_cost:it.unit_cost||0,description:"Estorno — pagamento cancelado",movement_date:ds,created_by:uid()})});
    }
    // devolve crédito de cliente usado neste pagamento
    for(const p of (Array.isArray(c.payment_parts)?c.payment_parts:[]).filter(x=>x.method==="credit"&&!o.keepPaid)){
      await api("client_credits",{method:"POST",body:JSON.stringify({client_phone:o.phone||"",client_name:o.name||"",booking_id:id,amount:Number(p.amount),remaining_amount:Number(p.amount),status:"available",description:"Estorno de crédito — pagamento cancelado",created_by:uid()})}).catch(()=>null);
    }
    await api(`finance_booking_closures?id=eq.${c.id}`,{method:"DELETE"});
    api("finance_audit_log",{method:"POST",body:JSON.stringify({table_name:"finance_booking_closures",record_id:String(c.id),action:"payment_cancelled",new_data:{booking_id:id},changed_by:uid()})}).catch(()=>null);
  }
  return cl[0]||null;
}
// Cliente faltou mas já tinha pago: decidir o que fazer com o valor
function noShowPaidDialog(b,cl,done){
  document.querySelector(".nsm")?.remove();
  const amt=Number(cl.amount_paid||0);
  const m=document.createElement("div");m.className="nsm";
  m.innerHTML=`<div class="nsm-card"><h3>Cliente já pagou ${fm(amt)}</h3><p>${esc(b.client_name||"Cliente")} não compareceu. O que fazer com o valor?</p>
  <button type="button" data-ns="credit"><b>Guardar como crédito</b><span>O valor fica disponível para o próximo agendamento</span></button>
  <button type="button" data-ns="fee"><b>Cobrar como taxa de falta</b><span>O valor continua como receita no caixa</span></button>
  <button type="button" data-ns="refund"><b>Devolver ao cliente</b><span>Cancela o pagamento e remove do caixa</span></button>
  <button type="button" class="ns-x" data-ns="x">Voltar</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",async e=>{
    if(e.target===m){m.remove();return}
    const k=e.target.closest("[data-ns]")?.dataset.ns;if(!k)return;
    if(k==="x"){m.remove();return}
    try{
      if(k==="credit"){
        if(!b.client_phone)throw Error("O agendamento não tem telefone do cliente.");
        await undoPayment(b.id,{keepPaid:true});
        await api("client_credits",{method:"POST",body:JSON.stringify({client_phone:b.client_phone,client_name:b.client_name||"",booking_id:b.id,amount:amt,remaining_amount:amt,status:"available",description:`Crédito — não compareceu em ${formatBookingDateBR(b.date)}`,created_by:uid()})});
      }else if(k==="fee"){
        await api(`finance_booking_closures?id=eq.${cl.id}`,{method:"PATCH",body:JSON.stringify({no_show_fee:amt,balance_due:0})});
        await api(`finance_movements?booking_id=eq.${encodeURIComponent(b.id)}&status=eq.pending&category=eq.Contas a receber`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
      }else{
        await undoPayment(b.id,{phone:b.client_phone,name:b.client_name});
      }
      await api(`bookings?id=eq.${encodeURIComponent(b.id)}`,{method:"PATCH",body:JSON.stringify({status:"no_show"})});
      m.remove();await done?.();
    }catch(err){alert("Não foi possível concluir: "+err.message)}
  });
}
// Venda de crédito ao cliente
function sellCreditDialog(c,done){
  document.querySelector(".nsm")?.remove();
  let method="pix";
  const m=document.createElement("div");m.className="nsm";
  m.innerHTML=`<div class="nsm-card"><h3>Vender crédito</h3><p>${esc(c.name||"Cliente")} · o valor entra no caixa e fica disponível para abater em agendamentos.</p>
  <label class="pay-optrow"><span>Valor (R$)</span><div class="pay-money" style="width:130px"><i>R$</i><input id="sc-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="100,00"></div></label>
  <div class="pay-grid sc-grid">${PAY_METHODS.map(x=>`<button type="button" class="pay-tile ${x[0]===method?"on":""}" data-scm="${x[0]}"><span>${x[2]}</span>${x[1]}</button>`).join("")}</div>
  <label class="pay-optrow"><span>Data do pagamento</span><input type="date" id="sc-date" value="${todayLocal()}"></label>
  <div id="sc-err" class="pay-diff"></div>
  <button type="button" class="btn primary" id="sc-ok" style="width:100%;height:46px;margin-top:6px">Confirmar venda de crédito</button>
  <button type="button" class="ns-x" data-ns="x">Voltar</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest("[data-ns=x]")){m.remove();return}
    const t=e.target.closest("[data-scm]");if(t){method=t.dataset.scm;m.querySelectorAll("[data-scm]").forEach(x=>x.classList.toggle("on",x===t));return}
    if(e.target.closest("#sc-ok")){
      const amount=Math.round(Number(m.querySelector("#sc-amt").value||0)*100)/100,ds=m.querySelector("#sc-date").value||todayLocal();
      if(!(amount>0)){m.querySelector("#sc-err").textContent="Informe o valor do crédito.";return}
      const btn=e.target.closest("#sc-ok");btn.disabled=true;btn.textContent="Salvando…";
      try{
        await api("client_credits",{method:"POST",body:JSON.stringify({client_phone:c.phone,client_name:c.name||"",amount,remaining_amount:amount,status:"available",description:"Venda de crédito",created_by:uid()})});
        const mv={movement_date:ds,payment_method:method,status:"paid",created_by:uid()};
        await api("finance_movements",{method:"POST",body:JSON.stringify({...mv,kind:"income",description:`Venda de crédito — ${c.name||c.phone} (${payName(method)})`,category:"Venda de crédito",amount})});
        if(method==="cash"||method==="card")await api("finance_movements",{method:"POST",body:JSON.stringify({...mv,kind:"pro_labore",description:`Retirada automática venda de crédito — ${c.name||c.phone}`,category:"Retirada do proprietário",amount})});
        m.remove();await done?.();
      }catch(err){m.querySelector("#sc-err").textContent="Não foi possível registrar: "+err.message;btn.disabled=false;btn.textContent="Confirmar venda de crédito"}

async function saveAppointmentStatus(id,status){
  const dbStatusMap={pending:"pending",confirmed:"confirmed",completed:"completed",finalized:"finalized",no_show:"no_show",cancelled:"cancelled"};
  const dbStatus=dbStatusMap[status]||status;
  await api(`bookings?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify({status:dbStatus})});
  const all=getLocalBookingStatuses();delete all[String(id)];localStorage.setItem("barberShopJSBookingStatuses",JSON.stringify(all));
  closeStatusPicker(); await loadAgenda();
}
function openStatusPicker(id){
  closeStatusPicker();
  const scrim=document.createElement("div");scrim.className="status-picker-scrim";scrim.id="status-picker-scrim";
  scrim.innerHTML=`<section class="status-picker" role="dialog" aria-modal="true"><h3>Status do atendimento</h3>
  <button class="status-option-pending" data-set-status="pending">🟡 Pendente — aguarda confirmação</button>
  <button class="status-option-confirmed" data-set-status="confirmed">🔵 Confirmado</button>
  <button class="status-option-completed" data-set-status="completed">🟣 Atendido — falta pagar</button>
  <button class="status-option-finalized" data-set-status="finalized">🟢 Pago — finalizado</button>
  <button class="status-option-noshow" data-set-status="no_show">🔴 Não compareceu / faltou</button>
  <button data-set-status="cancelled">Cancelar agendamento</button>
  <button data-close-status>Fechar</button></section>`;
  document.body.appendChild(scrim);
  scrim.addEventListener("click",async e=>{
    if(e.target===scrim||e.target.closest("[data-close-status]")){closeStatusPicker();return}
    const b=e.target.closest("[data-set-status]");if(!b)return;
    const target=b.dataset.setStatus;
    if(target!=="finalized"){
      let cl=null;try{cl=(await api(`finance_booking_closures?select=*&booking_id=eq.${encodeURIComponent(id)}`))[0]||null}catch(err){}
      const paidBefore=Number(cl?.amount_paid||0);
      const cur=(await api(`bookings?select=*&id=eq.${encodeURIComponent(id)}`).catch(()=>[]))[0]||{};
      const curCls=statusClass(cur.status);
      const serviceDoneNow=["completed","finalized"].includes(curCls);
      if(paidBefore>0){
        if(target==="no_show"){closeStatusPicker();noShowPaidDialog(cur,cl,loadAgenda);return}
        if(target==="completed"&&!serviceDoneNow){
          try{await saveAppointmentStatus(id,Number(cl.balance_due||0)===0?"finalized":"completed")}catch(err){alert("Não foi possível atualizar o status: "+(err.message||err))}
          return;
        }
        if((target==="confirmed"||target==="pending")&&!serviceDoneNow){try{await saveAppointmentStatus(id,target)}catch(err){alert("Não foi possível atualizar o status: "+(err.message||err))}return}
        if(!(target==="completed"&&curCls==="completed")){
          closeStatusPicker();
          showAppConfirm("Esse atendimento já foi pago. Tem certeza que deseja cancelar o pagamento?",async()=>{try{await undoPayment(id,{phone:cur.client_phone,name:cur.client_name});await saveAppointmentStatus(id,target)}catch(err){alert("Não foi possível cancelar o pagamento: "+(err.message||err))}});
          return;
        }
      }
    }
    if(b.dataset.setStatus==="cancelled"){
      closeStatusPicker();
      showAppConfirm("Deseja cancelar o atendimento?",()=>saveAppointmentStatus(id,"cancelled").catch(err=>alert("Não foi possível cancelar: "+(err.message||err))));
      return;
    }
    if(b.dataset.setStatus==="finalized"){closeStatusPicker();try{const bk=(await api(`bookings?select=*&id=eq.${encodeURIComponent(id)}`))[0];openPaymentScreen(bk)}catch(err){alert("Não foi possível abrir o pagamento: "+err.message)}return}
    try{await saveAppointmentStatus(id,b.dataset.setStatus)}catch(err){alert("Não foi possível atualizar o status: "+(err.message||err))}
  });
}

<script>
(function(){
 const ID='current-time-indicator'; let timer=null;
 function findGrid(){
  const sels=['.agenda-grid','#agenda-grid','#schedule-grid','#calendar-grid','.schedule-grid','.calendar-grid','.timeline-grid','.time-grid','.agenda-timeline'];
  for(const s of sels){const e=document.querySelector(s);if(!e)continue;const t=[...e.querySelectorAll('*')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));if(t.length>=2)return {el:e,times:t};}
  const labels=[...document.querySelectorAll('body *')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));
  for(const n of labels){let e=n.parentElement;for(let i=0;e&&i<7;i++,e=e.parentElement){const t=[...e.querySelectorAll('*')].filter(x=>!x.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((x.textContent||'').trim()));if(t.length>=3)return {el:e,times:t};}}
  return null;
 }
 function update(){
  const info=findGrid();if(!info)return;const {el,times}=info,now=new Date(),m=now.getHours()*60+now.getMinutes();
  const a=[...new Set(times)].map(node=>{const q=(node.textContent||'').trim().match(/^(\d{1,2}):(\d{2})$/);return q?{node,minutes:+q[1]*60 + +q[2],rect:node.getBoundingClientRect()}:null}).filter(Boolean).sort((x,y)=>x.minutes-y.minutes);
  if(a.length<2)return;let lo=null,hi=null;for(let i=0;i<a.length-1;i++){if(m>=a[i].minutes&&m<=a[i+1].minutes){lo=a[i];hi=a[i+1];break;}}
  let line=document.getElementById(ID);if(!lo||!hi){if(line)line.style.display='none';return;}
  const r=el.getBoundingClientRect(),f=(m-lo.minutes)/(hi.minutes-lo.minutes||30),loY=lo.rect.top,hiY=hi.rect.top,y=loY+(hiY-loY)*f;
  if(!line){line=document.createElement('div');line.id=ID;el.appendChild(line);}
  if(getComputedStyle(el).position==='static')el.style.position='relative';
  line.style.top=(y-r.top+el.scrollTop)+'px';line.style.display='block';
 }
 function start(){if(timer)clearInterval(timer);update();timer=setInterval(update,10000);}
 document.addEventListener('DOMContentLoaded',start);window.addEventListener('load',start);window.addEventListener('resize',update);window.addEventListener('scroll',update,true);document.addEventListener('click',()=>setTimeout(update,250));start();
})();
</script>
