.ag-appt.status-pending-card{background:rgba(198,163,57,0.22);border-color:#E3B341}.ag-appt.status-confirmed-card{background:#26262a;border-color:#5B9BD5}.ag-appt.status-completed-card{background:rgba(127,57,198,0.22);border-color:rgba(121,51,204,0.50)}.ag-appt.status-finalized-card{background:rgba(57,198,110,0.22);border-color:#4DAA75}.ag-appt.status-partial-card{background:rgba(198,136,57,0.22);border-color:#E58A1F}.ag-appt.status-prepaid-card{background:rgba(57,198,179,0.22);border-color:#2BA79A}.ag-appt.status-noshow-card{background:rgba(198,57,57,0.22);border-color:#C95B5B}.ag-appt.status-cancelled-card{background:#26262a;border-color:rgba(255,255,255,0.16)}
.ag-seg{display:flex;gap:6px}.ag-seg button{flex:1;height:42px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.16);background:#1d1d20;color:#fff;font-weight:700;font-size:14px}.ag-seg button.on{border-color:#4F94D8;background:#26262a;box-shadow:0 0 0 2px #4F94D8 inset}
.slot.lunch{cursor:pointer}.slot-h{font-size:15px!important;margin:10px 2px 6px!important}
.slot-card{padding:10px 12px!important;border-radius:14px!important}
.slot-compact{display:flex!important;flex-wrap:wrap!important;justify-content:space-between;align-items:center!important;gap:8px!important}
.slot-compact>.field:first-child{display:flex!important;align-items:center;gap:8px;flex:1 1 0;min-width:0;margin:0!important;flex-wrap:nowrap}
.slot-compact label{margin:0!important;font-size:14px!important;font-weight:700;color:#fff;white-space:nowrap}
.slot-compact select,.slot-compact input{height:38px!important;min-height:0!important;padding:0 8px!important;font-size:16px!important;border-radius:10px!important;border:1px solid rgba(255,255,255,0.16)!important;background:#1d1d20!important;width:auto;min-width:0;flex:1 1 90px;max-width:none}
.slot-compact .btn{height:38px!important;min-height:0!important;padding:0 14px!important;border-radius:10px!important;font-size:15px!important}
.slot-compact #period-slot-custom-wrap{flex:1 1 100%;display:flex;align-items:center;gap:8px}
.agenda-paid{color:#8ae5b0}.agenda-meta{flex-wrap:wrap}
.pay-mini{margin-top:6px;padding-top:6px}.pay-mini b{font-size:16px}.pay-diff.warn{color:#f4be7b}.agenda-appointment.status-partial-card{background:rgba(198,143,57,0.22)!important;border:2px solid #F0A030!important;color:#f4be7b!important}.agenda-appointment.status-partial-card .agenda-sub{font-weight:700}
.sheet-action.pay{background:rgba(57,198,107,0.22)!important;border-color:rgba(51,204,107,0.50)!important}
</style>

async function enablePushNotifications(){

 await navigator.serviceWorker.ready;
 let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlBytes(PUSH_PUBLIC_KEY)});
 const response=await fetch(PUSH_FUNCTION,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action:"subscribe",subscription:sub.toJSON()})});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw Error(result.error||"Não foi possível registrar este aparelho.");

async function loadAgenda(){const date=key(day),wd=day.getDay();try{[bookings,hourPeriods,blocks,agBarbers]=await Promise.all([api(`bookings?select=*&date=eq.${date}&status=not.in.(cancelled,cancelado,canceled)&order=start_min`),api("business_hour_periods?select=id,start_date,end_date,active,schedule&active=eq.true"),api(`blocked_slots?select=*&date=eq.${date}&order=start_min`),api("rpc/agenda_barbers",{method:"POST",body:"{}"})]);
 try{pendingBal={};paidAmt={};const pids=(bookings||[]).map(x=>x.id);if(pids.length)(await api(`finance_booking_closures?select=booking_id,amount_paid,balance_due&booking_id=in.(${pids.join(",")})`)).forEach(c=>{const k=String(c.booking_id);paidAmt[k]=Number(c.amount_paid||0);if(Number(c.balance_due)>0)pendingBal[k]=Number(c.balance_due)})}catch(e){}

let agBarbers=[],allBookings=[],allBlocks=[],shopRanges=[],shopHours=null,agendaBarber="";
try{agendaBarber=localStorage.getItem("bsjs_agenda_barber")||""}catch(e){}
const agIntersect=(shop,mine)=>{const out=[];(shop||[]).forEach(a=>(mine||[]).forEach(m=>{const x=Math.max(Number(a.start_min),Number(m.start_min)),y=Math.min(Number(a.end_min),Number(m.end_min));if(y>x)out.push({start_min:x,end_min:y})}));return out};
const barberRanges=(b,wd,shop)=>{if(!b||!b.schedule)return shop;const mine=normalizeSchedule(b.schedule)[wd];return agIntersect(shop,mine)};
function applyAgendaBarber(){
 const list=agBarbers||[];
 if((agendaBarber==="all"&&list.length<2)||(agendaBarber!=="all"&&!list.some(b=>String(b.id)===String(agendaBarber))))agendaBarber=list.length>1?(window.__myBarberId&&list.some(b=>b.id===window.__myBarberId)?String(window.__myBarberId):String(list[0]?.id||"")):String(list[0]?.id||"");
 if(agendaBarber==="all"){bookings=allBookings;blocks=allBlocks;dayRanges=shopRanges;hours=shopHours;return}
 const b=list.find(x=>String(x.id)===String(agendaBarber));
 bookings=allBookings.filter(x=>String(x.barber_id)===String(agendaBarber));
 blocks=allBlocks.filter(x=>x.barber_id==null||String(x.barber_id)===String(agendaBarber));
 dayRanges=barberRanges(b,day.getDay(),shopRanges);
 hours=dayRanges.length?[{open_min:Math.min(...dayRanges.map(x=>x.start_min)),close_min:Math.max(...dayRanges.map(x=>x.end_min)),lunch_start:null,lunch_end:null}]:[];

function renderAgendaColumns(nav){
 const list=agBarbers||[],step=Math.max(5,Number(slotStep)||30),wd=day.getDay();
 const rg=list.map(b=>barberRanges(b,wd,shopRanges));
 const all=rg.flat();
 if(!all.length){shell("Agenda",nav+agendaChips()+`<p class="notice">Estabelecimento fechado ou horário não configurado para este dia.</p>`);return}
 const first0=Math.min(...all.map(r=>r.start_min)),last0=Math.max(...all.map(r=>r.end_min));
 let first=first0,last=last0;allBookings.forEach(b=>{if(Number.isFinite(Number(b.start_min)))first=Math.min(first,Number(b.start_min));if(Number.isFinite(Number(b.end_min)))last=Math.max(last,Number(b.end_min))});
 const set=new Set();for(let m=first0-Math.ceil((first0-first)/step)*step;m<last;m+=step)set.add(m);

   if(starting){const span=Math.max(1,times.filter(t=>t>=Number(starting.start_min)&&t<Number(starting.end_min)).length);html+=`<button type="button" class="ag-appt ${apptCls(starting)}" data-open-booking="${esc(starting.id)}" style="${pos} / span ${span}"><b>${esc(starting.client_name)}</b></button>`}

   else html+=`<button type="button" class="ag-cell" data-slot="${m}" data-slot-barber="${b.id}" style="${pos}" aria-label="Agendar ${hm(m)} com ${esc(b.name)}"></button>`;
  });
 });

}

async function clientStats(phone){
  const bks=await api(`bookings?select=id,date,start_min,end_min,status,services,total&client_phone=eq.${encodeURIComponent(phone)}&order=date.desc,start_min.desc`);
  let cls=[];try{if(bks.length)cls=await api(`finance_booking_closures?select=booking_id,amount_paid,balance_due&booking_id=in.(${bks.map(x=>x.id).join(",")})`)}catch(e){}

  const live=bks.filter(notCancelled);
  const sc=b=>statusClass(b.status),ns=b=>["no_show","nao_compareceu","faltou"].includes(normalizedStatus(b.status));
  const attended=live.filter(b=>["completed","finalized"].includes(sc(b))&&!ns(b));
  const noshows=live.filter(ns);
  const scheduled=live.filter(b=>["pending","confirmed"].includes(sc(b))&&!ns(b)).sort((a,b)=>a.date.localeCompare(b.date)||a.start_min-b.start_min);
  const owing=[];let owed=0;
  live.filter(b=>!ns(b)).forEach(b=>{const cl=cmap[String(b.id)];let v=0;if(cl)v=Number(cl.balance_due||0);else if(sc(b)==="completed")v=Number(b.total||0);if(v>0){owing.push({b,v});owed+=v}});
  const spent=cls.reduce((a,x)=>a+Number(x.amount_paid||0),0);
  const base=attended.length+noshows.length;
  let badge;
  if(base===0)badge={cls:"new",t:"🆕 Cliente novo",s:"Ainda sem histórico de atendimentos."};
  else if(noshows.length===0)badge={cls:"good",t:"✅ Cliente confiável",s:`Compareceu a todos os ${attended.length} agendamento(s) concluídos.`};
  else if(noshows.length===1&&noshows.length/base<=0.25)badge={cls:"warn",t:"⚠️ Atenção",s:`Faltou 1 vez em ${base} agendamento(s).`};
  else badge={cls:"bad",t:"⛔ Cliente não confiável",s:`Faltou ${noshows.length} de ${base} agendamento(s).`};
  return {bks,live,attended,noshows,scheduled,owing,owed,spent,badge,cancelledN:bks.length-live.length};
}

async function cancelClientPackage(id,phone,reload){
 try{
  const cp=(await api(`client_packages?select=*&id=eq.${id}`))[0];if(!cp)return;
  const grp=(await api(`client_packages?select=id,purchased_price,status&client_phone=eq.${encodeURIComponent(cp.client_phone)}&package_id=eq.${cp.package_id}&purchased_at=eq.${encodeURIComponent(cp.purchased_at)}`)).filter(x=>x.status!=="cancelled");
  const gsum=grp.reduce((a,x)=>a+Number(x.purchased_price||0),0),frac=gsum>0?Math.min(1,Number(cp.purchased_price||0)/gsum):1;
  const t0=new Date(cp.purchased_at).getTime(),lo=new Date(t0-60000).toISOString(),hi=new Date(t0+5*60000).toISOString();
  const nm=String(cp.package_name||"").replace(/[*(),]/g," ");
  let mv=[];try{mv=await api(`finance_movements?select=*&status=eq.paid&category=in.${encodeURIComponent('("Venda de pacote","Retirada do proprietário")')}&description=ilike.*${encodeURIComponent("Venda pacote "+nm)}*&created_at=gte.${encodeURIComponent(lo)}&created_at=lte.${encodeURIComponent(hi)}`)}catch(e){}
  const cn=String(cp.client_name||cp.client_phone||"");mv=mv.filter(x=>String(x.description||"").includes(cn));
  const pay=Math.round(mv.filter(x=>x.kind==="income").reduce((a,x)=>a+Number(x.amount||0),0)*frac*100)/100;
  const its=await api(`client_package_services?select=id,quantity_purchased,quantity_remaining&client_package_id=eq.${id}`);
  const used=its.reduce((a,i)=>a+Number(i.quantity_purchased)-Number(i.quantity_remaining),0);
  const ok=await appConfirmP(`Cancelar o pacote <b>${esc(cp.package_name)}</b>?${pay>0?`<br>O pagamento de ${fm(pay)} registrado na venda também será cancelado.`:""}${used>0?`<br>Ele já foi usado ${used} vez(es); esses atendimentos continuam no histórico.`:""}`,"Cancelar pacote");
  if(!ok)return;
  for(const x of mv){
   if(frac>=0.999)await api(`finance_movements?id=eq.${x.id}`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
   else await api(`finance_movements?id=eq.${x.id}`,{method:"PATCH",body:JSON.stringify({amount:Math.round(Number(x.amount)*(1-frac)*100)/100})});
  }
  await api(`client_packages?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
  await reload?.();
 }catch(e){alert("Não foi possível cancelar o pacote: "+e.message)}

let __promoCache=null;
function promoCalc(type,value,base){base=Number(base||0);value=Number(value||0);let p=base;if(type==="price")p=value;else if(type==="amount")p=base-value;else if(type==="percent")p=base*(1-Math.min(100,value)/100);p=Math.round(Math.max(0,Math.min(base,p))*100)/100;return p}
async function loadActivePromos(force){
 const t=Date.now();if(!force&&__promoCache&&t-__promoCache.t<45000)return __promoCache.map;
 const map={};
 try{
  const today=key(new Date());
  const ps=await api(`promotions?select=*&active=eq.true&starts_on=lte.${today}&ends_on=gte.${today}`);
  if(ps.length){
   const its=await api(`promotion_items?select=*&promotion_id=in.(${ps.map(p=>p.id).join(",")})`);
   its.forEach(i=>{const pr=ps.find(p=>p.id===i.promotion_id);const k=(i.product_id!=null?"p":"s")+(i.product_id!=null?i.product_id:i.service_id);(map[k]=map[k]||[]).push({name:pr.name,type:i.discount_type,value:Number(i.value)})});
  }
 }catch(e){}
 __promoCache={t,map};return map;
}
function promoFor(map,kind,id,base){
 const l=map[kind+id];if(!l)return null;let best=null;
 l.forEach(x=>{const p=promoCalc(x.type,x.value,base);if(p<Number(base)&&(!best||p<best.price))best={price:p,name:x.name}});
 return best;
}

async function applyPromosToServices(list){const m=await loadActivePromos();return list.map(c=>{const pr=promoFor(m,"s",c.id,c.price);return pr?{...c,orig_price:Number(c.price),price:pr.price,promo:pr.name}:c})}

 $("#cancel-professional").onclick=loadProfessionals;
 let permCur={...rpBase(x.role||"barber"),...(x.perm_overrides||{})};
 const drawPerms=()=>{const w=$("#prof-perm-wrap"),r=$("#prof-role").value;if(r==="owner"){w.innerHTML='<label>Permissões</label><p class="muted">O proprietário tem acesso total.</p>';return}

  const msg=t=>$("#acc-msg").innerHTML=t;

  $("#acc-toggle").onclick=async()=>{try{await staffCall("set_disabled",{barber_id:x.id,disabled:!st.disabled});drawAccess()}catch(e){msg(`<span class="error">${esc(e.message)}</span>`)}};
  $("#acc-remove").onclick=async()=>{if(!confirm("Remover o acesso de "+x.name+"? Ele não poderá mais entrar. O cadastro de profissional continua."))return;try{await staffCall("remove",{barber_id:x.id});await loadProfessionals();openProfessionalForm(x.id);setNotice("Acesso removido.","success")}catch(e){msg(`<span class="error">${esc(e.message)}</span>`)}};

 for(let d=0;d<7;d++){["ps-on-","ps-l-"].forEach(p=>$("#"+p+d).onchange=()=>lunchSync(d));lunchSync(d)}

  try{

   else{const made=await api("barbers",{method:"POST",body:JSON.stringify(data)});bid=made?.[0]?.id}

 };

const PERM_DEFS=[["agenda_all","Ver a agenda de todos os profissionais","Desligado: vê só a própria agenda"],["booking_manage","Confirmar, cancelar e editar agendamentos",""],["booking_transfer","Alterar o barbeiro de um agendamento",""],["block_slots","Bloquear horários",""],["clients_view","Ver clientes","Lista, telefone e ficha"],["clients_edit","Cadastrar e editar clientes",""],["catalog_edit","Editar serviços, produtos e preços",""],["finance_view","Ver o Financeiro",""],["finance_edit","Receber pagamentos e lançar no Financeiro","Inclui o caixa"]];
const DEFAULT_RP={manager:{agenda_all:true,booking_manage:true,booking_transfer:true,block_slots:true,clients_view:true,clients_edit:true,catalog_edit:false,finance_view:false,finance_edit:false},barber:{agenda_all:false,booking_manage:true,booking_transfer:true,block_slots:true,clients_view:false,clients_edit:false,catalog_edit:false,finance_view:false,finance_edit:false},cashier:{agenda_all:true,booking_manage:true,booking_transfer:true,block_slots:false,clients_view:true,clients_edit:true,catalog_edit:false,finance_view:true,finance_edit:true}};
const ROLE_LABEL={owner:"Proprietário",manager:"Gerente",cashier:"Atendente",barber:"Barbeiro"};
let rolePerms={};
const roleKey=r=>(r==="barber"||r==="cashier")?r:"manager";
const rpBase=r=>({...DEFAULT_RP[roleKey(r)],...(rolePerms[roleKey(r)]||{})});
function can(k){const m=window.__me;return !m||m.owner||!!(m.perms&&m.perms[k])}
function guardPage(p){const m=window.__me;if(!m||m.owner)return p;if(["settings-hours","settings-professionals","settings-messages","settings-payments","settings-roles"].includes(p))return can("catalog_edit")?"settings":"agenda";if((p==="clients"||p==="birthdays")&&!can("clients_view"))return "agenda";if(["settings","services","products","packages","combos","promotions"].includes(p)&&!can("catalog_edit"))return "agenda";return p}
async function loadMe(){try{const r=await api("rpc/app_me",{method:"POST",body:"{}"});window.__me=r;window.__myBarberId=r&&!r.owner?r.barber_id:null}catch(e){window.__me=null}applyMenuPerms()}
function applyMenuPerms(){const m=window.__me;const set=(sel,show)=>{const el=$(sel);if(el)el.classList.toggle("hidden",!show)};set('[data-page="settings"]',!m||m.owner||can("catalog_edit"));set('[data-page="clients"]',can("clients_view"));set('[data-page="birthdays"]',can("clients_view"));set("#finance-menu",can("finance_view"))}
async function staffCall(action,extra={}){const r=await fetch(SB+"/functions/v1/staff-admin",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||("Falha ("+r.status+")"));return j}
function permSwitches(cur,pfx){return PERM_DEFS.map(([k,t,h])=>`<label class="perm-row"><span><b>${t}</b>${h?`<small>${h}</small>`:""}</span><input type="checkbox" class="sw" data-${pfx}="${k}" ${cur[k]?"checked":""}></label>`).join("")}
function bindPermSwitches(host,pfx,cur){host.querySelectorAll(`[data-${pfx}]`).forEach(inp=>inp.onchange=()=>{const k=inp.dataset[pfx];cur[k]=inp.checked;if(k==="finance_edit"&&inp.checked){cur.finance_view=true;const v=host.querySelector(`[data-${pfx}="finance_view"]`);if(v)v.checked=true}if(k==="finance_view"&&!inp.checked){cur.finance_edit=false;const v=host.querySelector(`[data-${pfx}="finance_edit"]`);if(v)v.checked=false}})}

async function loadRoles(){
 try{const rp=await api("role_permissions?select=role,perms");rolePerms={};rp.forEach(r=>rolePerms[r.role]=r.perms||{})}catch(e){}
 let people=[];try{people=await api("barbers?select=id,name,role,active,user_id&order=id")}catch(e){}
 let tab=window.__roleTab||"manager";
 const DESC={manager:"Ajuda a administrar a barbearia.",cashier:"Fica no caixa: recebe pagamentos e vê toda a agenda.",barber:"Atende os clientes. Por padrão vê só a própria agenda."};
 const draw=()=>{
  const cur={...rpBase(tab)};window.__roleCur=cur;
  const who=people.filter(p=>roleKey(p.role)===tab&&p.role!=="owner");
  shell("Permissões e acessos",`<div class="settings-back-row"><button type="button" class="btn" id="roles-back">← Configurações</button></div>
  <p class="muted" style="margin:0 0 10px">Defina o que cada função pode fazer. Vale para todos com essa função; dentro do cadastro de cada profissional você ainda pode ajustar uma pessoa só.</p>
  <div class="ag-seg" id="role-seg" style="margin-bottom:10px">${["manager","cashier","barber"].map(r=>`<button type="button" data-role-tab="${r}" class="${r===tab?"on":""}">${r==="manager"?"Gerente":r==="cashier"?"Atendente":"Barbeiro"}</button>`).join("")}</div>
  <div class="card" style="margin:0"><b>${ROLE_LABEL[tab]}</b><div class="muted" style="margin:2px 0 6px">${DESC[tab]}</div><div id="role-switches">${permSwitches(cur,"rp")}</div>
  <p class="muted" style="margin:10px 0 0;font-size:12.5px">Quem tem esta função: ${who.length?who.map(w=>esc(w.name.split(" ")[0])+(w.user_id?"":" (sem login)")).join(", "):"ninguém ainda"}.</p></div>
  <p class="muted" style="margin:10px 2px 0;font-size:12.5px">Só o proprietário acessa: Configurações, horários da barbearia, profissionais, formas de pagamento e criação de logins.</p>
  <div class="std-actions"><button type="button" class="btn primary" id="roles-save">Salvar permissões</button><button type="button" class="btn" id="roles-reset">Restaurar padrão</button></div>`);
  bindPermSwitches($("#role-switches"),"rp",cur);
  $("#roles-back").onclick=()=>navigate("settings");
  $("#role-seg").querySelectorAll("[data-role-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.roleTab;window.__roleTab=tab;draw()});
  $("#roles-reset").onclick=()=>{rolePerms[tab]={...DEFAULT_RP[tab]};const c=$("#role-switches");c.innerHTML=permSwitches(DEFAULT_RP[tab],"rp");Object.assign(cur,DEFAULT_RP[tab]);bindPermSwitches(c,"rp",cur)};
  $("#roles-save").onclick=async()=>{try{await api(`role_permissions?role=eq.${tab}`,{method:"PATCH",body:JSON.stringify({perms:cur,updated_at:new Date().toISOString()})});rolePerms[tab]={...cur};setNotice("Permissões de "+ROLE_LABEL[tab]+" salvas.","success")}catch(e){alert("Não foi possível salvar: "+e.message)}};
 };
 draw();
}

 const close=()=>{$("#pw-sheet")?.remove();document.body.classList.remove("sheet-open")};
 $("#pw-cancel").onclick=close;$("#pw-sheet").addEventListener("click",e=>{if(e.target.id==="pw-sheet")close()});bindSheetDrag($("#pw-sheet"),close);
 $("#pw-save").onclick=async()=>{const a=$("#pw1").value,b=$("#pw2").value,m=$("#pw-msg");if(a.length<8){m.textContent="A senha precisa ter pelo menos 8 caracteres.";return}if(a!==b){m.textContent="As senhas não são iguais.";return}
  try{const r=await fetch(SB+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({password:a})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.msg||j.message||j.error_description||"Falha");close();alert("Senha alterada.")}catch(e){m.textContent="Não foi possível alterar: "+e.message}};

function mins(id){let v=val(id);if(!v)return null;let [h,m]=v.split(":").map(Number);return h*60+m}
$("#app").addEventListener("submit",async e=>{if(e.target.id!=="hours-form")return;e.preventDefault();try{for(const x of hours){let wd=x.weekday,o=mins("o-"+wd),c=mins("c-"+wd),ls=mins("ls-"+wd),le=mins("le-"+wd);if((o==null)!=(c==null))throw Error("Informe abertura e fechamento ou deixe ambos vazios.");if(o!=null&&c<=o)throw Error("Fechamento deve ser depois da abertura: "+DW[wd]);await api(`business_hours?weekday=eq.${wd}`,{method:"PATCH",body:JSON.stringify({open_min:o,close_min:c,lunch_start:ls,lunch_end:le})})}await loadHours();notice="Horários atualizados.";renderNotice("success")}catch(err){$("#notice").innerHTML=`<div class="notice error">${esc(err.message)}</div>`}});

function renderLoginOrPage(){if(!session){loginView();return}currentUserUI();setTimeout(refreshNotifBadge,600);const qs=new URLSearchParams(location.search),pendingReview=qs.get("booking");if(pendingReview){showBookingReview(pendingReview);return}const pgq=qs.get("page");if(pgq&&["agenda","clients","birthdays","settings","settings-professionals"].includes(pgq))page=pgq;navigate(page)}
function serviceDurationMinutes(service){
 const name=String(service?.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 const thirtyMinuteServices=new Set(["corte simples","degrade na zero","degrade navalhado","degrade na shaver","undercut feminino","corte feminino"]);
 return thirtyMinuteServices.has(name) ? 30*Number(service?.qty||1) : Math.max(0,Number(service?.duration_min||0))*Number(service?.qty||1);
}

function normalizedStatus(status){return String(status||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[ -]+/g,"_")}
function notCancelled(b){return !/cancel/.test(normalizedStatus(b&&b.status))}
function statusPortuguese(status){const s=normalizedStatus(status);return ({cancelled:"Cancelado",canceled:"Cancelado",cancelado:"Cancelado",cancelada:"Cancelado",confirmed:"Confirmado",confirmado:"Confirmado",confirmada:"Confirmado",completed:"Realizado",done:"Realizado",realizado:"Realizado",realizada:"Realizado",concluido:"Realizado",concluida:"Realizado",finalizado:"Finalizado",finalizada:"Finalizado",finalized:"Finalizado",finalised:"Finalizado",atendido:"Realizado",atendida:"Realizado",pending:"Pendente",pendente:"Pendente",no_show:"Não compareceu"})[s]||"Pendente"}

const pkgBlockedG=(p,all)=>!!p.starts_at&&all.some(o=>o.id!==p.id&&o.status==="active"&&o.package_id===p.package_id&&o.purchased_at===p.purchased_at&&(!o.starts_at||o.starts_at<p.starts_at)&&(!o.expires_at||new Date(o.expires_at)>new Date()));
function pkgCover(d){const out={};if(!d||d.usePkg===false||!d.pkgId)return out;const p=(d.pkgs||[]).find(x=>x.id===d.pkgId);if(!p)return out;(d.services||[]).forEach(s=>{const it=p.items.find(i=>Number(i.service_id)===Number(s.id));if(it){const c=Math.min(Number(s.qty||1),it.rem);if(c>0)out[s.id]=c}});return out}
function bookingSubtotal(d){const cv=pkgCover(d);return d.services.reduce((a,x)=>a+Number(x.price||0)*(Number(x.qty||1)-(cv[x.id]||0)),0)}

 return `<div class="bdp" data-bdp="${id}"><select aria-label="Dia"><option value="">Dia</option>${D}</select><select aria-label="Mês"><option value="">Mês</option>${M}</select><select aria-label="Ano"><option value="">Ano</option>${A}</select></div><input type="hidden" id="${id}" value="${m?m[0]:""}">`}
document.addEventListener("change",e=>{const w=e.target.closest&&e.target.closest("[data-bdp]");if(!w)return;const ss=w.querySelectorAll("select"),y=+ss[2].value,mo=+ss[1].value;let d=+ss[0].value;if(y&&mo&&d){const dim=new Date(y,mo,0).getDate();if(d>dim){d=dim;ss[0].value=String(d)}}const h=document.getElementById(w.dataset.bdp);if(h)h.value=(y&&mo&&d)?y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0"):""});
const pkgDateBR=t=>String(t||"").slice(0,10).split("-").reverse().join("/");
function pkgCardInner(d){

 const on=d.usePkg!==false,cv=pkgCover(d),covered=Object.keys(cv).length>0;
 const rem=p=>p.items.reduce((a,i)=>a+i.rem,0);
 const info=p=>`<span>restam ${rem(p)}${p.expires_at?" · até "+pkgDateBR(p.expires_at):""}</span>`;

  (d.pkgs.length>1?`<div class="pkc-list">${d.pkgs.map(p=>`<button type="button" data-bb="x" class="pkc-opt${p.id===d.pkgId?" on":""}" data-pkg-pick="${p.id}"><b>${esc(p.name)}</b>${info(p)}</button>`).join("")}</div>`:`<div class="pkc-one"><b>${esc(d.pkgs[0].name)}</b>${info(d.pkgs[0])}</div>`)+

}
function refreshPkgUI(){

 const box=$("#pkg-card");if(box){box.innerHTML=pkgCardInner(d);box.classList.toggle("hidden",!(d.pkgs&&d.pkgs.length))}
 const cv=pkgCover(d),p=d.usePkg!==false&&(d.pkgs||[]).find(x=>x.id===d.pkgId);
 document.querySelectorAll(".service-choice[data-sid]").forEach(row=>{
  const el=row.querySelector(".svc-price");if(!el)return;
  const sid=Number(row.dataset.sid),sel=d.services.find(x=>Number(x.id)===sid),it=p&&p.items.find(i=>Number(i.service_id)===sid);
  const base=sel?Number(sel.price||0):Number((d.catalog.find(c=>Number(c.id)===sid)||{}).price||0);
  let t=fm(base);
  if(it&&it.rem>0){const q=sel?Number(sel.qty||1):1;if(!sel||(cv[sid]||0)>=q)t="Pacote";else if(cv[sid])t="Pacote ×"+cv[sid]+" + "+fm(base*(q-cv[sid]))}
  el.textContent=t;el.classList.toggle("pkg",t.indexOf("Pacote")===0);
 });
}
async function loadBookingPkgs(){
 const d=bookingDraft;if(!d)return;const phone=d.selectedPhone;
 if(!phone||d.mode!=="book"){d.pkgs=[];d.pkgId=null;refreshPkgUI();refreshBookingTotals(true);return}
 const enc=encodeURIComponent(phone);
 try{
  const cps=await api(`client_packages?select=*&client_phone=eq.${enc}&status=eq.active`);
  let its=[];if(cps.length)its=await api(`client_package_services?select=*&client_package_id=in.(${cps.map(p=>p.id).join(",")})`);
  const bks=await api(`bookings?select=id,services,status&client_phone=eq.${enc}&status=in.(pending,confirmed,completed)`);
  const pb=bks.filter(b=>String(b.id)!==String(d.editingId)&&(b.services||[]).some(x=>x&&x.pkg));
  let reds=[];if(pb.length)reds=await api(`client_package_redemptions?select=booking_id&booking_id=in.(${pb.map(b=>b.id).join(",")})`);
  const done=new Set(reds.map(r=>String(r.booking_id))),reserved={};
  pb.filter(b=>!done.has(String(b.id))).forEach(b=>b.services.forEach(x=>{if(x&&x.pkg){const k=x.pkg+"|"+x.id;reserved[k]=(reserved[k]||0)+Number(x.pkgQty||0)}}));
  d.pkgs=cps.filter(p=>(!p.expires_at||new Date(p.expires_at)>new Date())&&!pkgBlockedG(p,cps)).map(p=>({id:p.id,name:p.package_name,expires_at:p.expires_at,items:its.filter(i=>i.client_package_id===p.id).map(i=>({service_id:i.service_id,name:i.service_name,rem:Math.max(0,Number(i.quantity_remaining)-(reserved[p.id+"|"+i.service_id]||0))}))})).filter(p=>p.items.some(i=>i.rem>0));
  const tot=p=>p.items.reduce((a,i)=>a+i.rem,0);
  d.pkgs.sort((a,b)=>tot(b)-tot(a)||String(a.expires_at||"9").localeCompare(String(b.expires_at||"9")));
 }catch(e){d.pkgs=[]}
 if(!d.pkgs.some(p=>p.id===d.pkgId))d.pkgId=d.pkgs[0]?.id||null;
 refreshPkgUI();refreshBookingTotals(true);
}
async function redeemBookingPackage(b){
 const sv=(Array.isArray(b.services)?b.services:[]).filter(x=>x&&x.pkg&&Number(x.pkgQty)>0);if(!sv.length)return;
 const touched=new Set();
 for(const x of sv){
  const its=await api(`client_package_services?select=*&client_package_id=eq.${x.pkg}`);
  const it=its.find(i=>Number(i.service_id)===Number(x.id))||its.find(i=>String(i.service_name).toLowerCase()===String(x.name).toLowerCase());
  if(!it)continue;
  const q=Math.min(Number(x.pkgQty),Number(it.quantity_remaining));if(q<=0)continue;
  await api(`client_package_services?id=eq.${it.id}`,{method:"PATCH",body:JSON.stringify({quantity_remaining:Number(it.quantity_remaining)-q})});
  await api("client_package_redemptions",{method:"POST",body:JSON.stringify({client_package_service_id:it.id,booking_id:b.id,quantity:q,redeemed_by:uid()})});
  touched.add(x.pkg);
 }
 for(const cpid of touched){
  const cp=(await api(`client_packages?select=*&id=eq.${cpid}`))[0];if(!cp)continue;
  const its=await api(`client_package_services?select=quantity_remaining&client_package_id=eq.${cpid}`);
  const patch={};
  if(cp.validity_start_mode==="first_use"&&!cp.first_used_at){
   const first=new Date();patch.first_used_at=first.toISOString();
   const pk=(await api(`service_packages?select=*&id=eq.${cp.package_id}`).catch(()=>[]))[0];
   if(pk&&pk.has_expiration&&pk.expiration_value){const dd=new Date(first);dd.setDate(dd.getDate()+Number(pk.expiration_value)*(pk.expiration_unit==="weeks"?7:1));patch.expires_at=dd.toISOString()}
  }
  if(its.every(i=>Number(i.quantity_remaining)<=0))patch.status="used";
  if(Object.keys(patch).length)await api(`client_packages?id=eq.${cpid}`,{method:"PATCH",body:JSON.stringify(patch)});
 }
}
async function unredeemBooking(id){
 const rd=await api(`client_package_redemptions?select=*&booking_id=eq.${encodeURIComponent(id)}`).catch(()=>[]);
 for(const r of rd){
  const it=(await api(`client_package_services?select=*&id=eq.${r.client_package_service_id}`).catch(()=>[]))[0];
  if(it){await api(`client_package_services?id=eq.${it.id}`,{method:"PATCH",body:JSON.stringify({quantity_remaining:Number(it.quantity_remaining)+Number(r.quantity)})});await api(`client_packages?id=eq.${it.client_package_id}&status=eq.used`,{method:"PATCH",body:JSON.stringify({status:"active"})}).catch(()=>null)}
 }
 if(rd.length)await api(`client_package_redemptions?booking_id=eq.${encodeURIComponent(id)}`,{method:"DELETE"});
}
function comboAmount(c,sub){const v=Number(c.discount||0);return Math.max(0,Math.min(sub,c.discount_type==="percent"?Math.round(sub*Math.min(v,100))/100:v))}
function bookingCombo(d){
 const cvv=pkgCover(d);const ids=d.services.filter(x=>Number(x.qty||1)-(cvv[x.id]||0)>0).map(x=>Number(x.id));let best=null;const sub=bookingSubtotal(d);
 (d.combos||[]).filter(c=>c.active).forEach(c=>{
  const groups={};c.items.forEach(i=>{(groups[i.group_no]=groups[i.group_no]||[]).push(Number(i.service_id))});
  const gs=Object.values(groups);
  if(gs.length&&gs.every(g=>g.some(id=>ids.includes(id)))){if(!best||comboAmount(c,sub)>comboAmount(best,sub))best=c}
 });
 return best;
}
function bookingTotals(d){
 const sub=bookingSubtotal(d),combo=bookingCombo(d);
 const comboVal=combo&&!d.comboOff?comboAmount(combo,sub):0;
 const disc=Math.max(0,Number(d.discount||0)),sur=Math.max(0,Number(d.surcharge||0));
 return {sub,combo,comboVal,disc,sur,total:Math.max(0,sub-comboVal-disc+sur)};
}

      const take=amt=>{const out=[];let need=Math.round(amt*100)/100;for(const q of queue){if(need<=0.0049)break;const u=Math.min(q.amount,need);if(u<=0)continue;out.push({method:q.method,amount:Math.round(u*100)/100});q.amount=Math.round((q.amount-u)*100)/100;need=Math.round((need-u)*100)/100}return out};
      const sum=l=>Math.round(l.reduce((a,p)=>a+Number(p.amount||0),0)*100)/100;
      const pendingFor=(bk,amount)=>api("finance_movements",{method:"POST",body:JSON.stringify({kind:"income",movement_date:ds,description:`Saldo a receber — ${bk.client_name} (${formatBookingDateBR(bk.date)})`,category:"Contas a receber",amount,payment_method:"other",status:"pending",booking_id:bk.id,created_by:uid()})});
      const moves=async(bk,alloc)=>{
        for(const p of alloc){
          if(p.method==="credit"){
            let need=p.amount;
            for(const cr of credits){if(need<=0)break;const av=Number(cr.remaining_amount||0),use=Math.min(av,need);if(use<=0)continue;const left=Math.round((av-use)*100)/100;await api(`client_credits?id=eq.${cr.id}`,{method:"PATCH",body:JSON.stringify({remaining_amount:left,status:left>0?"available":"used"})});cr.remaining_amount=left;need=Math.round((need-use)*100)/100}
            continue;
          }
          const mv={movement_date:ds,...payMv(p.method),status:"paid",booking_id:bk.id,created_by:uid()};
          await api("finance_movements",{method:"POST",body:JSON.stringify({...mv,kind:"income",description:`Atendimento ${bk.client_name} (${payName(p.method)})`,category:"Atendimento",amount:p.amount})});
          if(["cash","card"].includes(payKind(p.method)))await api("finance_movements",{method:"POST",body:JSON.stringify({...mv,kind:"pro_labore",description:`Retirada automática sobre atendimento ${bk.client_name} (${payName(p.method)})`,category:"Retirada do proprietário",amount:p.amount})});
          if(payKind(p.method)==="card"&&feeOf(p.method)>0)await api("finance_movements",{method:"POST",body:JSON.stringify({...mv,kind:"expense",description:`Taxa cartão atendimento ${bk.client_name}`,category:"Taxas de cartão",amount:Math.round(p.amount*feeOf(p.method))/100})});
        }
      };
      const settle=async(bk,exb,due,alloc,products)=>{
        const pa=sum(alloc),nb=Math.round((due-pa)*100)/100,ppt=products.reduce((a,p)=>a+p.quantity*p.unit_price,0);
        const tot=Math.round(Number(bk.total||0)*100)/100;
        let cid=exb?.id;
        if(!exb){
          const disc=Number(bk.discount||0)+Number(bk.combo_discount||0),sur=Number(bk.surcharge||0);
          const c=(await api("finance_booking_closures",{method:"POST",body:JSON.stringify({booking_id:bk.id,service_total:Math.round((tot+disc-sur)*100)/100,product_total:ppt,discount:disc,surcharge:sur,grand_total:Math.round((tot+ppt)*100)/100,amount_paid:pa,balance_due:nb,product_items:products,payment_parts:alloc.map(p=>({...p,date:ds})),no_show_fee:0,notes:"",closed_by:uid()})}))[0];
          cid=c?.id;
          if(nb>0)await pendingFor(bk,nb);
        }else{
          await api(`finance_booking_closures?id=eq.${exb.id}`,{method:"PATCH",body:JSON.stringify({product_total:Math.round((Number(exb.product_total||0)+ppt)*100)/100,grand_total:Math.round((tot+Number(exb.product_total||0)+ppt)*100)/100,product_items:[...(Array.isArray(exb.product_items)?exb.product_items:[]),...products],amount_paid:Math.round((Number(exb.amount_paid||0)+pa)*100)/100,balance_due:nb,payment_parts:[...(Array.isArray(exb.payment_parts)?exb.payment_parts:[]),...alloc.map(p=>({...p,date:ds}))]})});
          const pend=(await api(`finance_movements?select=id&booking_id=eq.${encodeURIComponent(bk.id)}&category=eq.Contas a receber&status=eq.pending`).catch(()=>[]))[0];
          if(pend)await api(`finance_movements?id=eq.${pend.id}`,{method:"PATCH",body:JSON.stringify(nb>0?{amount:nb}:{status:"cancelled"})});
          else if(nb>0)await pendingFor(bk,nb);

        await moves(bk,alloc);
        api("finance_audit_log",{method:"POST",body:JSON.stringify({table_name:"finance_booking_closures",record_id:String(cid??""),action:exb?"updated":"created",new_data:{booking_id:bk.id,amount_paid:pa,balance_due:nb,products:products.length,payment_date:ds},changed_by:uid()})}).catch(()=>null);
        return nb;
      };
      // atendimento atual
      const curAlloc=take(Math.min(p0,curDue));
      const newBal=await settle(b,ex,curDue,curAlloc,prods);
      if(pkgPending){await redeemBookingPackage(b);pkgPending=false}
      for(const p of prods){const c=catalog.find(z=>z.id===p.product_id);await api(`finance_products?id=eq.${p.product_id}`,{method:"PATCH",body:JSON.stringify({stock_quantity:Number(c.stock_quantity)-p.quantity,updated_at:new Date().toISOString()})});await api("finance_stock_movements",{method:"POST",body:JSON.stringify({product_id:p.product_id,movement_type:"sale",quantity:p.quantity,unit_cost:p.unit_cost||0,description:`Venda no atendimento ${b.client_name}`,movement_date:ds,created_by:uid()})})}
      let st;
      if(!needsDoneToggle)st=newBal>0?"completed":"finalized";
      else if(serviceDone)st=newBal>0?"completed":"finalized";
      else st=b.status;
      if(st!==b.status)await api(`bookings?id=eq.${encodeURIComponent(b.id)}`,{method:"PATCH",body:JSON.stringify({status:st})});
      // agendamentos anteriores incluídos
      for(const o of inclList){
        const al=take(o.v);if(!al.length)continue;

        const exo=(await api(`finance_booking_closures?select=*&booking_id=eq.${encodeURIComponent(o.b.id)}`).catch(()=>[]))[0]||null;

      }
      close();await loadAgenda();
    }catch(err){alert("Não foi possível registrar o pagamento: "+err.message);btn.disabled=false;btn.textContent="Confirmar pagamento"}
  };
  draw();
}
async function undoPayment(id,o={}){
  if(!o.editing)await unredeemBooking(id).catch(()=>null);
  const cl=await api(`finance_booking_closures?select=*&booking_id=eq.${encodeURIComponent(id)}`);
  const cats=encodeURIComponent('("Atendimento","Retirada do proprietário","Taxas de cartão","Contas a receber","Caixinha")');
  if(o.keepPaid)await api(`finance_movements?booking_id=eq.${encodeURIComponent(id)}&status=eq.pending&category=eq.Contas a receber`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
  else await api(`finance_movements?booking_id=eq.${encodeURIComponent(id)}&status=in.(paid,pending)&category=in.${cats}`,{method:"PATCH",body:JSON.stringify({status:"cancelled"})});
  const ds=todayLocal();
  for(const c of cl){
    for(const it of (Array.isArray(c.product_items)?c.product_items:[])){
      const cur=(await api(`finance_products?select=id,stock_quantity&id=eq.${it.product_id}`).catch(()=>[]))[0];
      if(!cur)continue;
      await api(`finance_products?id=eq.${it.product_id}`,{method:"PATCH",body:JSON.stringify({stock_quantity:Number(cur.stock_quantity)+Number(it.quantity),updated_at:new Date().toISOString()})});
      await api("finance_stock_movements",{method:"POST",body:JSON.stringify({product_id:it.product_id,movement_type:"adjustment",quantity:Number(it.quantity),unit_cost:it.unit_cost||0,description:"Estorno — pagamento cancelado",movement_date:ds,created_by:uid()})});
    }
    // devolve crédito de cliente usado neste pagamento
    for(const p of (Array.isArray(c.payment_parts)?c.payment_parts:[]).filter(x=>x.method==="credit"&&!o.keepPaid)){
      await api("client_credits",{method:"POST",body:JSON.stringify({client_phone:o.phone||"",client_name:o.name||"",booking_id:id,amount:Number(p.amount),remaining_amount:Number(p.amount),status:"available",description:"Estorno de crédito — pagamento cancelado",created_by:uid()})}).catch(()=>null);
    }
    await api(`finance_booking_closures?id=eq.${c.id}`,{method:"DELETE"});
    api("finance_audit_log",{method:"POST",body:JSON.stringify({table_name:"finance_booking_closures",record_id:String(c.id),action:"payment_cancelled",new_data:{booking_id:id},changed_by:uid()})}).catch(()=>null);
  }
  return cl[0]||null;
}

function mountSplit(host,getTotal,onState){
 const r2=n=>Math.round(n*100)/100;let parts=[];
 const paid=()=>r2(parts.reduce((a,p)=>a+(Number(p.amount)||0),0));
 const info=()=>{const t=r2(getTotal()||0);if(!(t>0))return{ok:true,msg:"",cls:""};if(!parts.length)return{ok:false,msg:"Escolha a forma de pagamento.",cls:"warn"};if(parts.some(p=>!(Number(p.amount)>0)))return{ok:false,msg:"Informe o valor de cada forma.",cls:"warn"};const d=r2(t-paid());if(d===0)return{ok:true,msg:"Valor conferido ✓",cls:"ok"};return{ok:false,msg:d>0?`Faltam ${fm(d)} para fechar o valor`:`Passou ${fm(-d)} do valor`,cls:"warn"}};
 const upd=()=>{const i=info(),e=host.querySelector(".sp-diff");if(e){e.textContent=i.msg;e.className="pay-diff sp-diff "+i.cls}onState(i)};
 const draw=()=>{const L=payList();host.innerHTML=`<div class="pay-grid sc-grid">${L.map(x=>`<button type="button" class="pay-tile ${parts.find(p=>p.method===x[0])?"on":""}" data-spm="${x[0]}"><span>${x[2]}</span>${esc(x[1])}</button>`).join("")}</div>${parts.length?`<div class="pay-amts">${parts.map((p,i)=>{const mm=L.find(x=>x[0]===p.method)||[p.method,payName(p.method),"💰"];return `<label class="pay-amt"><span>${mm[2]} ${esc(mm[1])}</span><div class="pay-money"><i>R$</i><input data-spa="${i}" type="text" inputmode="decimal" autocomplete="off" value="${String(p.amount).replace(".",",")}"></div></label>`}).join("")}</div>`:`<p class="pay-hint">Toque em uma forma. Para dividir, toque em mais de uma e informe o valor de cada.</p>`}<div class="pay-diff sp-diff"></div>`;
  host.querySelectorAll("[data-spm]").forEach(b=>b.onclick=()=>{const m=b.dataset.spm,i=parts.findIndex(p=>p.method===m);if(i>=0)parts.splice(i,1);else parts.push({method:m,amount:parts.length?Math.max(0,r2(getTotal()-paid())):r2(getTotal()||0)});draw()});
  host.querySelectorAll("[data-spa]").forEach(inp=>inp.oninput=()=>{parts[Number(inp.dataset.spa)].amount=Number(String(inp.value).replace(",","."))||0;upd()});
  upd()};
 const refresh=()=>{const t=r2(getTotal()||0);if(!parts.length&&t>0){const L=payList();parts=[{method:(L.find(x=>x[3]==="pix")||L[0]||["pix"])[0],amount:t}]}else if(parts.length===1)parts[0].amount=t;draw()};
 return{draw,refresh,info,parts:()=>parts.filter(p=>Number(p.amount)>0)};
}

<script>
(function(){

 function findGrid(){

  for(const s of sels){const e=document.querySelector(s);if(!e)continue;const t=[...e.querySelectorAll('*')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));if(t.length>=2)return {el:e,times:t};}
  const labels=[...document.querySelectorAll('body *')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));
  for(const n of labels){let e=n.parentElement;for(let i=0;e&&i<7;i++,e=e.parentElement){const t=[...e.querySelectorAll('*')].filter(x=>!x.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((x.textContent||'').trim()));if(t.length>=3)return {el:e,times:t};}}
  return null;
 }
 function update(){
  const info=findGrid();if(!info)return;const {el,times}=info,now=new Date(),m=now.getHours()*60+now.getMinutes();
  const a=[...new Set(times)].map(node=>{const q=(node.textContent||'').trim().match(/^(\d{1,2}):(\d{2})$/);return q?{node,minutes:+q[1]*60 + +q[2],rect:(node.closest('.agenda-time-cell')||node).getBoundingClientRect()}:null}).filter(Boolean).sort((x,y)=>x.minutes-y.minutes);
  if(a.length<1)return;let lo=null,hi=null;const stp=(typeof slotStep==='number'&&slotStep>0)?slotStep:30;for(let i=0;i<a.length;i++){const nx=a[i+1],end=nx?Math.min(nx.minutes,a[i].minutes+stp):a[i].minutes+stp;if(m>=a[i].minutes&&m<end){lo=a[i];hi={minutes:end};break;}}
  let line=document.getElementById(ID);if(!lo||!hi){if(line)line.style.display='none';return;}
  const r=el.getBoundingClientRect(),f=(m-lo.minutes)/((hi.minutes-lo.minutes)||30),y=lo.rect.top+lo.rect.height*Math.min(1,Math.max(0,f));
