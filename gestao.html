const setting=(await api("business_hour_settings?select=slot_step_minutes&id=eq.true"))[0];slotStep=Number(setting?.slot_step_minutes||30);slotStepDraft=slotStep;const selected=hourPeriods.filter(p=>p.start_date<=date&&(!p.end_date||p.end_date>=date)).sort((a,b)=>b.start_date.localeCompare(a.start_date)||b.id-a.id)[0];if(selected){dayRanges=normalizeSchedule(selected.schedule)[wd];hours=dayRanges.length?[{open_min:Math.min(...dayRanges.map(x=>x.start_min)),close_min:Math.max(...dayRanges.map(x=>x.end_min)),lunch_start:null,lunch_end:null}]:[]}else{hours=await api(`business_hours?select=*&weekday=eq.${wd}`);const h=hours?.[0];dayRanges=h&&h.open_min!=null?(h.lunch_start!=null&&h.lunch_end!=null?[{start_min:h.open_min,end_min:h.lunch_start},{start_min:h.lunch_end,end_min:h.close_min}]:[{start_min:h.open_min,end_min:h.close_min}]):[]}const localStatuses=getLocalBookingStatuses();bookings=bookings.map(b=>localStatuses[String(b.id)]?{...b,status:localStatuses[String(b.id)]}:b);renderAgenda()}catch(e){shell("Agenda",`<p class="error">${esc(e.message)}</p><button class="btn" id="retry">Tentar novamente</button>`)}}
function renderAgenda(){
 let cfg=hours?.[0];
 let nav=`<div class="card agenda-toolbar"><button class="agenda-arrow" data-day="-1" aria-label="Dia anterior">‹</button><div class="agenda-date">${DW[day.getDay()]}, ${day.toLocaleDateString("pt-BR")}</div><button class="agenda-arrow" data-day="1" aria-label="Próximo dia">›</button><button class="btn agenda-mini" id="toggle-goto">Ir para data</button><button class="btn agenda-mini" id="today">Hoje</button></div><div class="goto-panel" id="goto-panel"><div class="field"><label>Escolha a data</label><input type="date" id="goto-date" value="${key(day)}"></div><button class="btn primary agenda-mini" id="goto">Ir</button></div>`;
 if(!cfg||cfg.open_min==null){shell("Agenda",nav+`<p class="notice">Estabelecimento fechado ou horário não configurado para este dia.</p>`);return}
 const step=Math.max(5,Number(slotStep)||30);
 let n=0;
 const validRanges=(dayRanges||[]).map(r=>({start_min:Number(r.start_min),end_min:Number(r.end_min)})).filter(r=>Number.isFinite(r.start_min)&&Number.isFinite(r.end_min)&&r.end_min>r.start_min).sort((a,b)=>a.start_min-b.start_min);
 if(!validRanges.length){shell("Agenda",nav+`<p class="notice">Estabelecimento fechado ou horário não configurado para este dia.</p>`);return}
 const firstStart=Math.min(...validRanges.map(r=>r.start_min));
 const lastEnd=Math.max(...validRanges.map(r=>r.end_min));
 const gridSet=new Set();
 // Dois horários antes da abertura, todos os intervalos até o fechamento
 // (incluindo cada horário do almoço) e dois horários depois do expediente.
 for(let m=firstStart-2*step;m<=lastEnd+2*step;m+=step)gridSet.add(m);
 // Garante a exibição exata dos inícios e finais cadastrados, mesmo quando
 // não coincidem com o múltiplo do intervalo selecionado.
 validRanges.forEach(r=>{gridSet.add(r.start_min);gridSet.add(r.end_min)});
 bookings.forEach(b=>gridSet.add(Number(b.start_min)));
 blocks.forEach(b=>gridSet.add(Number(b.start_min)));
 const gridTimes=[...gridSet].filter(m=>Number.isFinite(m)&&m>=0&&m<1440).sort((a,b)=>a-b);
 const times=[],right=[];
 // Distribui TODOS os agendamentos em "faixas": quem começa depois (ou no mesmo horário, mas foi criado depois)
 // fica por cima e um pouco deslocado à direita, para todos continuarem visíveis e clicáveis.
 const bookingsSorted=[...bookings].sort((a,b)=>Number(a.start_min)-Number(b.start_min)||String(a.created_at||"").localeCompare(String(b.created_at||""))||String(a.id).localeCompare(String(b.id)));
 const laneOf=new Map(),placed=[];
 bookingsSorted.forEach(b=>{const s0=Number(b.start_min),e0=Number(b.end_min);const used=new Set(placed.filter(x=>s0<Number(x.end_min)&&e0>Number(x.start_min)).map(x=>laneOf.get(String(x.id))));let l=0;while(used.has(l))l++;laneOf.set(String(b.id),l);placed.push(b)});
 for(let i=0;i<gridTimes.length;i++){
  const m=gridTimes[i],row=i+1;
  const starting=bookingsSorted.filter(x=>Number(x.start_min)===m);
  const occupying=bookings.find(x=>Number(x.start_min)<m&&Number(x.end_min)>m);
  const block=blocks.find(x=>Number(x.start_min)<=m&&Number(x.end_min)>m);
  const inRange=validRanges.some(r=>m>=r.start_min&&m<r.end_min);
  const outside=m<firstStart||m>=lastEnd;
  const lunch=!inRange&&!outside;
  const slotClass=outside?"outside":"";
  times.push(`<div class="agenda-time-cell ${slotClass} ${lunch?"lunch":""}" style="grid-row:${row};grid-column:1"><b>${hm(m)}</b></div>`);
  if(starting.length){
   starting.forEach(b=>{
    n++;
    const start=Number(b.start_min),end=Number(b.end_min);
    const lane=Math.min(laneOf.get(String(b.id))||0,6),off=lane*40;
    const durationSlots=Math.max(1,gridTimes.filter(t=>t>=start&&t<end).length);
    right.push(`<button class="card appointment-card agenda-appointment ${appointmentCardStatus(b.status)}" data-open-booking="${esc(b.id)}" style="grid-column:2;grid-row:${row} / span ${durationSlots};width:calc(100% - ${off}px);margin-left:${off}px;z-index:${10+lane};box-shadow:${lane?"-4px 3px 12px #00000026":"0 4px 18px #00000009"}"><div class="agenda-appt-main"><b class="agenda-client">${esc(b.client_name)}</b></div><span class="agenda-chevron">›</span></button>`);
   });
  }else if(occupying){
  }else if(block){
   right.push(`<button class="btn slot agenda-slot blocked" data-open-block="${esc(block.id)}" style="grid-column:2;grid-row:${row}"><span class="desc">Bloqueado${block.reason?" · "+esc(block.reason):""}</span><span class="pill">Opções</span></button>`);
  }else if(outside){
   right.push(`<button type="button" class="btn slot agenda-slot outside" data-slot="${m}" aria-label="Agendar manualmente às ${hm(m)} — fora do expediente" title="Agendar manualmente fora do expediente" style="grid-column:2;grid-row:${row}"></button>`);
  }else if(lunch){
   right.push(`<div class="btn slot agenda-slot lunch" aria-hidden="true" style="grid-column:2;grid-row:${row}"><span class="desc">Intervalo de almoço</span></div>`);
  }else{
   right.push(`<button class="btn slot agenda-slot" data-slot="${m}" aria-label="Agendar ou bloquear às ${hm(m)}" style="grid-column:2;grid-row:${row}"></button>`);
  }
 }
 const out=`<div class="agenda-grid" style="--agenda-step:${step/30}">${times.join("")}${right.join("")}</div><button class="agenda-fab" id="agenda-new-booking" aria-label="Novo agendamento" title="Novo agendamento">＋</button>`;
 shell("Agenda",nav+`<div class="muted agenda-summary">${n} agendamento(s) · ${fm(bookings.reduce((sum,x)=>sum+Number(x.total||0),0))}</div>`+out+`<div class="muted">Toque em um horário para agendar ou bloquear.</div>`);
}

function applyBookingMessage(template,booking){

 const tokens={nome:booking.client_name||"cliente",dia:date,hora:hm(booking.start_min),data:date};
 return String(template||"").replace(/\{(nome|dia|data|hora)\}/gi,(match,key)=>tokens[key.toLowerCase()]??match);
}

function serviceDurationMinutes(service){
 const name=String(service?.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 const thirtyMinuteServices=new Set(["corte simples","degrade na zero","degrade navalhado","degrade na shaver","undercut feminino","corte feminino"]);
 return thirtyMinuteServices.has(name) ? 30*Number(service?.qty||1) : Math.max(0,Number(service?.duration_min||0))*Number(service?.qty||1);
}

function normalizedStatus(status){return String(status||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[ -]+/g,"_")}
function statusPortuguese(status){const s=normalizedStatus(status);return ({cancelled:"Cancelado",canceled:"Cancelado",cancelado:"Cancelado",cancelada:"Cancelado",confirmed:"Confirmado",confirmado:"Confirmado",confirmada:"Confirmado",completed:"Realizado",done:"Realizado",realizado:"Realizado",realizada:"Realizado",concluido:"Realizado",concluida:"Realizado",finalizado:"Finalizado",finalizada:"Finalizado",finalized:"Finalizado",finalised:"Finalizado",atendido:"Realizado",atendida:"Realizado",pending:"Pendente",pendente:"Pendente",no_show:"Não compareceu"})[s]||"Pendente"}
function statusClass(status){const s=normalizedStatus(status);if(["cancelled","canceled","cancelado","cancelada"].includes(s))return "cancelled";if(["finalizado","finalizada","finalized","finalised"].includes(s))return "finalized";if(["completed","done","realizado","realizada","concluido","concluida","atendido","atendida"].includes(s))return "completed";if(["confirmed","confirmado","confirmada"].includes(s))return "confirmed";return "pending"}
function appointmentCardStatus(status){
 const s=normalizedStatus(status);
 if(["no_show","nao_compareceu","faltou"].includes(s))return "status-noshow-card";
 if(["cancelled","canceled","cancelado","cancelada"].includes(s))return "status-cancelled-card";
 if(["finalizado","finalizada","finalized","finalised"].includes(s))return "status-finalized-card";
 if(["completed","done","realizado","realizada","concluido","concluida","atendido","atendida"].includes(s))return "status-completed-card";
 if(["confirmed","confirmado","confirmada"].includes(s))return "status-confirmed-card";
 return "status-pending-card";
}
function serviceAddsDuration(service){
 const name=String(service?.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 return ["corte simples","degrade na zero","degrade navalhado","degrade na shaver","undercut feminino","corte feminino"].includes(name);
}
function selectedServicesDuration(services){
 return (services||[]).reduce((total,service)=>total+(serviceAddsDuration(service)?30*Number(service.qty||1):0),0);
}
function bindSheetDrag(scrim,close){
const panel=scrim?.querySelector(".action-sheet"),grip=scrim?.querySelector(".sheet-grabber");if(!panel||!grip)return;
let sy=0,dy=0,active=false;
const dismiss=()=>{panel.style.transition="transform .24s ease";panel.style.transform="translate3d(0,110%,0)";setTimeout(close,240)};
panel.addEventListener("touchstart",e=>{if(!e.touches.length)return;sy=e.touches[0].clientY;dy=0;active=true;panel.style.transition="none"},{passive:true});
panel.addEventListener("touchmove",e=>{if(!active||!e.touches.length)return;const y=e.touches[0].clientY-sy;if(y>0){dy=y;panel.style.transform=`translate3d(0,${dy}px,0)`;e.preventDefault()}},{passive:false});
panel.addEventListener("touchend",()=>{if(!active)return;active=false;panel.style.transition="transform .22s ease";if(dy>75)dismiss();else panel.style.transform="translate3d(0,0,0)"},{passive:true});
grip.addEventListener("click",dismiss);
scrim.addEventListener("click",e=>{if(e.target===scrim)dismiss()});
}

async function saveBookingForm(){
 readBookingInputs();const d=bookingDraft;const err=$("#booking-error");
 try{
  if(d.start==null||!$("#booking-start")?.value){err.textContent="Escolha o horário de início do agendamento.";err.classList.remove("hidden");$("#booking-start")?.focus();return}
  if(!d.services.length)throw Error("Selecione pelo menos um serviço.");
  // Confere se o período completo do atendimento cabe em um intervalo de expediente.
  // Se não couber, o usuário pode confirmar o encaixe ou voltar e alterar o horário.
  const bookingDate=key(d.date);
  let allowedRanges=[];
  const periodsForDate=await api("business_hour_periods?select=start_date,end_date,active,schedule&active=eq.true");
  const matchingPeriod=periodsForDate
    .filter(p=>p.start_date<=bookingDate&&(!p.end_date||p.end_date>=bookingDate))
    .sort((a,b)=>b.start_date.localeCompare(a.start_date))[0];
  if(matchingPeriod){
    allowedRanges=normalizeSchedule(matchingPeriod.schedule)[d.date.getDay()]||[];
  }else{
    const legacyDay=(await api(`business_hours?select=*&weekday=eq.${d.date.getDay()}`))[0];
    if(legacyDay&&legacyDay.open_min!=null){
      allowedRanges=legacyDay.lunch_start!=null&&legacyDay.lunch_end!=null
        ?[{start_min:Number(legacyDay.open_min),end_min:Number(legacyDay.lunch_start)},{start_min:Number(legacyDay.lunch_end),end_min:Number(legacyDay.close_min)}]
        :[{start_min:Number(legacyDay.open_min),end_min:Number(legacyDay.close_min)}];
    }
  }
  let client=d.clients.find(c=>c.phone===d.selectedPhone),newClientData=null;
  if(!client&&d.addingClient){
   const name=d.newName.trim(),phone=d.newPhone.replace(/\D/g,'');
   if(!name||phone.length<10)throw Error("Informe nome e telefone com DDD para cadastrar o novo cliente.");
   newClientData={phone,name};client={phone,name};
  }
  if(!client)throw Error("Selecione um cliente cadastrado ou toque em + para cadastrar um novo.");
  const duration=Math.max(30,d.services.reduce((a,x)=>a+Math.max(Number(x.duration_min||0),x.is_cut?30*Number(x.qty||1):0),0));
  const suggestedEnd=d.start+Math.ceil(duration/30)*30;
  const end=Number.isFinite(d.end)&&d.end>d.start?d.end:suggestedEnd;
  if(end<=d.start)throw Error("O horário final precisa ser depois do horário inicial.");
  if(end>1440)throw Error("O atendimento não pode terminar após a meia-noite. Divida o atendimento em outro agendamento.");
  const insideBusinessHours=allowedRanges.some(r=>d.start>=Number(r.start_min)&&end<=Number(r.end_min));
  if(!insideBusinessHours){
    const confirmed=confirm("O horário de agendamento está fora do expediente.\n\nDeseja confirmar esse agendamento mesmo assim?\n\nOK: continuar e salvar.\nCancelar: voltar ao formulário para alterar o horário.");
    if(!confirmed)return;
  }
  const conflicts=bookings.filter(b=>String(b.id)!==String(d.editingId)&&Number(b.start_min)<end&&Number(b.end_min)>d.start);if(conflicts.length){const aceitaConflito=confirm("Atenção: este horário entra em conflito com outro agendamento ("+conflicts.map(b=>b.client_name+" às "+hm(b.start_min)).join(", ")+"). Deseja realizar mesmo assim?");if(!aceitaConflito)return;}
  if(blocks.some(b=>Number(b.start_min)<end&&Number(b.end_min)>d.start))throw Error("Esse horário está bloqueado.");
  if(newClientData){
    await api("clients?on_conflict=phone",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify(newClientData)});
  }
  const barber=d.barbers[0];if(!barber)throw Error("Cadastre um profissional ativo.");
  const total=d.services.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||1),0);
  const payload={barber_id:barber.id,date:key(d.date),start_min:d.start,end_min:end,client_name:client.name,client_phone:client.phone,services:d.services.map(x=>({id:x.id,name:x.name,qty:Number(x.qty||1),price:Number(x.price||0)})),total,status:d.existingStatus||"confirmed"};if(d.editingId)await api(`bookings?id=eq.${encodeURIComponent(d.editingId)}`,{method:"PATCH",body:JSON.stringify(payload)});else await api("bookings",{method:"POST",body:JSON.stringify(payload)});
  bookingDraft=null;day=d.date;await loadAgenda();
  }catch(e){let message=e.message||"Não foi possível salvar o agendamento.";if(message.includes("23P01")||message.includes("bookings_barber_id_date_int4range_excl")||message.includes("exclusion constraint"))message="O banco estava bloqueando horários sobrepostos. A restrição foi removida; atualize a página e tente novamente. Se persistir, confira se a versão publicada usa o projeto Supabase correto.";if(err){err.textContent=message;err.classList.remove('hidden')}else alert(message)}
}

let appointmentHoldTimer=null, appointmentHoldTriggered=false, appointmentHoldTarget=null;
function closeStatusPicker(){document.querySelector("#status-picker-scrim")?.remove()}
function showAppConfirm(message,onOk){
  document.querySelector("#app-confirm-scrim")?.remove();
  const scrim=document.createElement("div");scrim.id="app-confirm-scrim";scrim.className="app-confirm-scrim";
  scrim.innerHTML=`<section class="app-confirm" role="dialog" aria-modal="true"><p>${message}</p><button type="button" data-confirm-cancel>Cancelar</button><button type="button" data-confirm-ok>OK</button></section>`;
  document.body.appendChild(scrim);
  scrim.addEventListener("click",async e=>{
    if(e.target===scrim||e.target.closest("[data-confirm-cancel]")){scrim.remove();return}
    if(e.target.closest("[data-confirm-ok]")){scrim.remove();await onOk()}
  });
}
async function saveAppointmentStatus(id,status){
  const dbStatusMap={pending:"pending",confirmed:"confirmed",completed:"completed",finalized:"finalized",no_show:"no_show",cancelled:"cancelled"};
  const dbStatus=dbStatusMap[status]||status;
  await api(`bookings?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify({status:dbStatus})});
  const all=getLocalBookingStatuses();delete all[String(id)];localStorage.setItem("barberShopJSBookingStatuses",JSON.stringify(all));
  closeStatusPicker(); await loadAgenda();
}
function openStatusPicker(id){
  closeStatusPicker();
  const scrim=document.createElement("div");scrim.className="status-picker-scrim";scrim.id="status-picker-scrim";
  scrim.innerHTML=`<section class="status-picker" role="dialog" aria-modal="true"><h3>Status do atendimento</h3>
  <button class="status-option-pending" data-set-status="pending">🟠 Pendente — aguarda confirmação</button>
  <button class="status-option-confirmed" data-set-status="confirmed">🔵 Confirmado</button>
  <button class="status-option-completed" data-set-status="completed">🟣 Realizado — serviço concluído</button>
  <button class="status-option-finalized" data-set-status="finalized">🟢 Finalizado — pagamento efetuado</button>
  <button class="status-option-noshow" data-set-status="no_show">🔴 Não compareceu / faltou</button>
  <button data-set-status="cancelled">Cancelar agendamento</button>
  <button data-close-status>Fechar</button></section>`;
  document.body.appendChild(scrim);
  scrim.addEventListener("click",async e=>{
    if(e.target===scrim||e.target.closest("[data-close-status]")){closeStatusPicker();return}
    const b=e.target.closest("[data-set-status]");if(!b)return;
    if(b.dataset.setStatus==="cancelled"){
      closeStatusPicker();
      showAppConfirm("Deseja cancelar o atendimento?",()=>saveAppointmentStatus(id,"cancelled").catch(err=>alert("Não foi possível cancelar: "+(err.message||err))));
      return;
    }
    try{await saveAppointmentStatus(id,b.dataset.setStatus)}catch(err){alert("Não foi possível atualizar o status: "+(err.message||err))}
  });
}
document.addEventListener("pointerdown",e=>{
  const card=e.target.closest(".agenda-appointment[data-open-booking]");if(!card)return;
  appointmentHoldTriggered=false;appointmentHoldTarget=card;
  clearTimeout(appointmentHoldTimer);
  appointmentHoldTimer=setTimeout(()=>{appointmentHoldTriggered=true;openStatusPicker(card.dataset.openBooking)},550);
});
document.addEventListener("pointerup",()=>clearTimeout(appointmentHoldTimer));
document.addEventListener("pointercancel",()=>clearTimeout(appointmentHoldTimer));
document.addEventListener("contextmenu",e=>{
  const card=e.target.closest(".agenda-appointment[data-open-booking]");if(!card)return;
  e.preventDefault();clearTimeout(appointmentHoldTimer);appointmentHoldTriggered=true;openStatusPicker(card.dataset.openBooking);
});
document.addEventListener("click",e=>{
  if(appointmentHoldTriggered&&e.target.closest(".agenda-appointment[data-open-booking]")){
    e.preventDefault();e.stopImmediatePropagation();appointmentHoldTriggered=false;
  }
},true);

if(session){const pendingReview=new URLSearchParams(location.search).get("booking");if(pendingReview)showBookingReview(pendingReview);else renderLoginOrPage()}else loginView();

<script>
(function(){
 const ID='current-time-indicator'; let timer=null;
 function findGrid(){
  const sels=['.agenda-grid','#agenda-grid','#schedule-grid','#calendar-grid','.schedule-grid','.calendar-grid','.timeline-grid','.time-grid','.agenda-timeline'];
  for(const s of sels){const e=document.querySelector(s);if(!e)continue;const t=[...e.querySelectorAll('*')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));if(t.length>=2)return {el:e,times:t};}
  const labels=[...document.querySelectorAll('body *')].filter(n=>!n.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((n.textContent||'').trim()));
  for(const n of labels){let e=n.parentElement;for(let i=0;e&&i<7;i++,e=e.parentElement){const t=[...e.querySelectorAll('*')].filter(x=>!x.children.length&&/^([01]?\d|2[0-3]):[0-5]\d$/.test((x.textContent||'').trim()));if(t.length>=3)return {el:e,times:t};}}
  return null;
 }
 function update(){
  const info=findGrid();if(!info)return;const {el,times}=info,now=new Date(),m=now.getHours()*60+now.getMinutes();
  const a=[...new Set(times)].map(node=>{const q=(node.textContent||'').trim().match(/^(\d{1,2}):(\d{2})$/);return q?{node,minutes:+q[1]*60 + +q[2],rect:node.getBoundingClientRect()}:null}).filter(Boolean).sort((x,y)=>x.minutes-y.minutes);
  if(a.length<2)return;let lo=null,hi=null;for(let i=0;i<a.length-1;i++){if(m>=a[i].minutes&&m<=a[i+1].minutes){lo=a[i];hi=a[i+1];break;}}
  let line=document.getElementById(ID);if(!lo||!hi){if(line)line.style.display='none';return;}
  const r=el.getBoundingClientRect(),f=(m-lo.minutes)/(hi.minutes-lo.minutes||30),loY=lo.rect.top,hiY=hi.rect.top,y=loY+(hiY-loY)*f;
  if(!line){line=document.createElement('div');line.id=ID;el.appendChild(line);}
  if(getComputedStyle(el).position==='static')el.style.position='relative';
  line.style.top=(y-r.top+el.scrollTop)+'px';line.style.display='block';
 }
 function start(){if(timer)clearInterval(timer);update();timer=setInterval(update,10000);}
 document.addEventListener('DOMContentLoaded',start);window.addEventListener('load',start);window.addEventListener('resize',update);window.addEventListener('scroll',update,true);document.addEventListener('click',()=>setTimeout(update,250));start();
})();
</script>
