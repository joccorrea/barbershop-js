function normalizedStatus(status){return String(status||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[ -]+/g,"_")}
function statusPortuguese(status){const s=normalizedStatus(status);return ({cancelled:"Cancelado",canceled:"Cancelado",cancelado:"Cancelado",cancelada:"Cancelado",confirmed:"Confirmado",confirmado:"Confirmado",confirmada:"Confirmado",completed:"Realizado",done:"Realizado",realizado:"Realizado",realizada:"Realizado",concluido:"Realizado",concluida:"Realizado",finalizado:"Realizado",finalizada:"Realizado",atendido:"Realizado",atendida:"Realizado",pending:"Pendente",pendente:"Pendente",no_show:"Não compareceu"})[s]||"Pendente"}
function statusClass(status){const s=normalizedStatus(status);if(["cancelled","canceled","cancelado","cancelada"].includes(s))return "cancelled";if(["completed","done","realizado","realizada","concluido","concluida","finalizado","finalizada","atendido","atendida"].includes(s))return "completed";if(["confirmed","confirmado","confirmada"].includes(s))return "confirmed";return "pending"}
function bindSheetDrag(scrim,close){
const panel=scrim?.querySelector(".action-sheet"),grip=scrim?.querySelector(".sheet-grabber");if(!panel||!grip)return;
let sx=0,sy=0,dx=0,dy=0,axis=null,active=false;
panel.addEventListener("touchstart",e=>{if(!e.touches.length)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=dy=0;axis=null;active=true;panel.style.transition="none"},{passive:true});
panel.addEventListener("touchmove",e=>{
 if(!active||!e.touches.length)return;
 const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
 if(!axis&&Math.max(Math.abs(x),Math.abs(y))>8)axis=Math.abs(x)>Math.abs(y)*1.15?"x":(Math.abs(y)>Math.abs(x)*1.15?"y":null);
 if(axis==="x"&&x>0){dx=x;panel.style.transform=`translate3d(${dx}px,0,0)`;scrim.style.background="transparent";e.preventDefault()}
 else if(axis==="y"&&y>0){dy=y;panel.style.transform=`translate3d(0,${dy}px,0)`;e.preventDefault()}
},{passive:false});
panel.addEventListener("touchend",()=>{
 if(!active)return;active=false;panel.style.transition="transform .22s ease";
 if(axis==="x"){if(dx>window.innerWidth*.28){panel.style.transform="translate3d(110%,0,0)";setTimeout(close,220)}else{panel.style.transform="translate3d(0,0,0)";scrim.style.background=""}}
 else if(axis==="y"){if(dy>75){panel.style.transform="translate3d(0,110%,0)";setTimeout(close,220)}else panel.style.transform="translate3d(0,0,0)"}
},{passive:true});
grip.addEventListener("click",()=>{panel.style.transition="transform .22s ease";panel.style.transform="translate3d(0,110%,0)";setTimeout(close,220)});

let swipeBackSnapshot="",swipeBackScrollY=0;
async function openBooking(start,mode='book',existing=null){
 try{
  if(!$(".booking-screen")){swipeBackSnapshot=app.innerHTML;swipeBackScrollY=window.scrollY}
  const [cs,ss,bs]=await Promise.all([api("clients?select=phone,name&order=name"),api("services?select=id,name,price,is_cut,duration_min,active&active=eq.true&order=sort"),api("barbers?select=id,name,active&active=eq.true&order=id")]);
  const ddate=existing?.date?new Date(existing.date+"T12:00:00"):new Date(day.getFullYear(),day.getMonth(),day.getDate());const savedServices=existing?.services||[];bookingDraft={mode,start:Number(existing?.start_min??start),date:ddate,clients:cs,catalog:ss,barbers:bs,services:savedServices.map(x=>({...x,id:x.id??ss.find(y=>y.name===x.name)?.id})),query:'',newName:'',newPhone:'',selectedPhone:existing?.client_phone||null,addingClient:false,end:Number(existing?.end_min??(start+30)),endDate:ddate,editingId:existing?.id||null,editingBlockId:existing?.blockId||null,reason:existing?.reason||'',existingStatus:existing?.status||"confirmed",endManuallyChanged:false};
  renderBookingScreen();
 }catch(e){alert("Não foi possível abrir o formulário: "+e.message)}
}
function readBookingInputs(){
 if(!bookingDraft)return;
 const date=$("#booking-date")?.value;
 const st=$("#booking-start")?.value;
 if(date)bookingDraft.date=new Date(date+"T12:00:00");
 if(st){const [h,m]=st.split(':').map(Number);bookingDraft.start=h*60+m}
 const en=$("#booking-end")?.value;
 if(en){const [h,m]=en.split(':').map(Number);bookingDraft.end=h*60+m}
 const endDate=$("#booking-end-date")?.value;
 if(endDate)bookingDraft.endDate=new Date(endDate+"T12:00:00");
 bookingDraft.query=$("#booking-client-search")?.value??bookingDraft.query;
 if($("#booking-new-name"))bookingDraft.newName=$("#booking-new-name").value;
 if($("#booking-new-phone"))bookingDraft.newPhone=$("#booking-new-phone").value;
 bookingDraft.reason=$("#booking-reason")?.value||'';
}
async function saveBookingForm(){
 readBookingInputs();const d=bookingDraft;const err=$("#booking-error");
 try{
  if(!d.services.length)throw Error("Selecione pelo menos um serviço.");
  let client=d.clients.find(c=>c.phone===d.selectedPhone);
  if(!client&&d.addingClient){
   const name=d.newName.trim(),phone=d.newPhone.replace(/\D/g,'');
   if(!name||phone.length<10)throw Error("Informe nome e telefone com DDD para cadastrar o novo cliente.");
   await api("clients?on_conflict=phone",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify({phone,name})});client={phone,name};
  }
  if(!client)throw Error("Selecione um cliente cadastrado ou toque em + para cadastrar um novo.");
  const duration=Math.max(30,d.services.reduce((a,x)=>a+Math.max(Number(x.duration_min||0),x.is_cut?30*Number(x.qty||1):0),0));
  const suggestedEnd=d.start+Math.ceil(duration/30)*30;
  const end=Number.isFinite(d.end)&&d.end>d.start?d.end:suggestedEnd;
  if(end<=d.start)throw Error("O horário final precisa ser depois do horário inicial.");
  if(end>1440)throw Error("O atendimento não pode terminar após a meia-noite. Divida o atendimento em outro agendamento.");
  const conflicts=bookings.filter(b=>String(b.id)!==String(d.editingId)&&Number(b.start_min)<end&&Number(b.end_min)>d.start);if(conflicts.length&&!confirm("Atenção: este horário entra em conflito com outro agendamento ("+conflicts.map(b=>b.client_name+" às "+hm(b.start_min)).join(", ")+"). Deseja realizar mesmo assim?"))return;
  if(blocks.some(b=>Number(b.start_min)<end&&Number(b.end_min)>d.start))throw Error("Esse horário está bloqueado.");
  const barber=d.barbers[0];if(!barber)throw Error("Cadastre um profissional ativo.");
  const total=d.services.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||1),0);
  const payload={barber_id:barber.id,date:key(d.date),start_min:d.start,end_min:end,client_name:client.name,client_phone:client.phone,services:d.services.map(x=>({id:x.id,name:x.name,qty:Number(x.qty||1),price:Number(x.price||0)})),total,status:d.existingStatus||"confirmed"};if(d.editingId)await api(`bookings?id=eq.${encodeURIComponent(d.editingId)}`,{method:"PATCH",body:JSON.stringify(payload)});else await api("bookings",{method:"POST",body:JSON.stringify(payload)});
  bookingDraft=null;day=d.date;await loadAgenda();
 }catch(e){if(err){err.textContent=e.message;err.classList.remove('hidden')}else alert(e.message)}
}
