<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="theme-color" content="#A9D0F5"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbershop Js – Agendamento</title>
<style>
:root{--bg:#EEF6FF;--card:#fff;--tx:#10304F;--mu:#4A6B8C;--ac:#1F4B75;--on:#F6F1E9;--bd:#C4DFF8;--gold:#4F94D8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#F3F9FF 0%,#E2EFFC 100%) fixed;color:var(--tx);font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:linear-gradient(135deg,#D6EAFC,#A9D0F5);color:#10304F;border-bottom:4px solid #6FA8DC}
.hd{display:flex;gap:14px;align-items:center;max-width:480px;margin:0 auto;padding:24px 16px}
.logo{width:72px;height:72px;border-radius:0;background:transparent;flex:none;object-fit:contain;border:0}
.hd a{display:block;margin-top:4px;text-decoration:none;color:#10304F;font-size:13px;line-height:1.35}
h1{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:32px;line-height:1;margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}
h2{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:27px;line-height:1.1;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.3px}
main{max-width:480px;margin:0 auto;padding:6px 16px 120px}
.hd .mu{color:#10304F}
.mu{color:var(--mu);font-size:14px;margin:0}.er{color:#B3342B;font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.st{display:flex;align-items:center;gap:12px}.st span{min-width:16px;text-align:center;font-weight:600}
.st button{width:40px;height:40px;border-radius:50%;border:1px solid #B5D2EE;background:var(--bg);color:var(--tx);font-size:20px}
.st button[data-d="1"]{background:#1F4B75;border-color:#1F4B75;color:#F6F1E9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;min-height:44px;border-radius:12px;border:1px solid #B5D2EE;background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.chip.on{background:#1F4B75;color:#F6F1E9;border-color:#1F4B75}
.bar{position:fixed;left:0;right:0;bottom:0;background:transparent;border:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;pointer-events:none;z-index:20}
.bar>*{pointer-events:auto}
.bar div{font-size:13px;font-weight:600;color:#1F4B75;background:#fffffff2;border:1px solid #C4DFF8;border-radius:999px;padding:9px 14px;box-shadow:0 4px 14px #1f4b7526;backdrop-filter:blur(6px)}
.bar div:empty{display:none}.bar .go{margin-left:auto;box-shadow:0 8px 22px #1f4b7547}
body{padding-bottom:110px}
.bar div{font-size:14px}
.go{display:inline-block;text-decoration:none;text-align:center;background:#1F4B75;color:#F6F1E9;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:600}
a.go{background:#1F7A4A;color:#fff;display:block;margin-top:12px}
.go:disabled{opacity:.35}
.lnk{background:none;border:0;color:#1F4B75;padding:10px 0;min-height:44px;font-size:14px;font-weight:600}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #B5D2EE;background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
input:focus{outline:2px solid #4F94D888;border-color:var(--gold)}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.code{background:#1F4B75;color:#FFFFFF;border-radius:14px;padding:10px;text-align:center;font-family:"Barlow Condensed",Inter,sans-serif;font-size:46px;font-weight:700;letter-spacing:8px;margin:8px 0}
.pill{display:inline-block;background:#FFF1D6;color:#7A4B00;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pc{background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:16px 8px;text-align:center;font-weight:700;font-size:15px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:8px}.pc.on{border-color:#4F94D8;background:#EAF4FF;box-shadow:0 0 0 2px #4F94D8 inset}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#A9D0F5,#4F94D8);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center}.av.any{background:#fff;color:#4F94D8;border:2px dashed #4F94D8}

/* sombra padrão em todas as caixas */
:root{--box-shadow:0 4px 12px rgba(35,120,212,.14),0 1px 3px rgba(31,75,117,.14)}
.chip,.sum,.pc,.code,input,select,textarea,.st button{box-shadow:var(--box-shadow)}
.chip.on{box-shadow:0 4px 12px rgba(31,75,117,.30),0 1px 3px rgba(31,75,117,.2)}
.sum .sum,.pc .chip{box-shadow:none}
</style>

const total=()=>Math.max(0,gross()-cdisc());
const items=()=>q.reduce((a,b)=>a+b,0);
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const lab=d=>DW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
const pd=s=>{const [y,m,d]=s.split("-");return new Date(+y,m-1,+d)};
const activePeriod=d=>H.filter(p=>p.active&&p.start_date<=key(d)&&(!p.end_date||p.end_date>=key(d))).sort((a,b)=>b.start_date.localeCompare(a.start_date)||b.id-a.id)[0]||null;
const shopIntervals=d=>{const p=activePeriod(d);if(p){const v=p.schedule?.[String(d.getDay())];return Array.isArray(v)?v:[]}const o=LEGACY[d.getDay()];if(!o||o.open_min==null)return [];const out=[];if(o.lunch_start!=null&&o.lunch_end!=null&&o.lunch_end>o.lunch_start){out.push({start_min:o.open_min,end_min:o.lunch_start},{start_min:o.lunch_end,end_min:o.close_min})}else out.push({start_min:o.open_min,end_min:o.close_min});return out};
const intervals=(d,b)=>{const base=shopIntervals(d);if(!b||!b.schedule)return base;const mine=b.schedule[String(d.getDay())];if(!Array.isArray(mine))return [];const out=[];base.forEach(a=>mine.forEach(m=>{const x=Math.max(Number(a.start_min),Number(m.start_min)),y=Math.min(Number(a.end_min),Number(m.end_min));if(y>x)out.push({start_min:x,end_min:y})}));return out};
const doesSvc=(bid,sid)=>!BS.length||BS.some(x=>x.barber_id===bid&&x.service_id===sid);
const vis=s=>BSEL==null?PR.some(b=>doesSvc(b.id,s.id)):doesSvc(BSEL,s.id);
const cand=()=>{const ids=SV.filter((s,i)=>q[i]).map(s=>s.id);return PR.filter(b=>(BSEL==null||b.id===BSEL)&&ids.every(id=>doesSvc(b.id,id)))};
const open=d=>cand().some(b=>intervals(d,b).length>0);
function days(){const r=[],n=new Date();for(let i=0;r.length<14&&i<40;i++){const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(open(x))r.push(x)}return r}
function slots(d){const n=dur(),now=new Date(),td=key(now)==key(d),nm=now.getHours()*60+now.getMinutes(),set=new Set();for(const b of cand()){const bz=busyBy[b.id]||[];for(const o of intervals(d,b)){for(let t=Number(o.start_min);t+n<=Number(o.end_min);t+=slotStep){if(bz.some(x=>t<x.end_min&&t+n>x.start_min))continue;if(td&&t<=nm)continue;set.add(t)}}}return [...set].sort((a,b)=>a-b)}
async function loadBusy(){const d=date;try{const list=cand(),res=await Promise.all(list.map(b=>rpc("get_busy",{p_date:key(d),p_barber:b.id})));if(date===d){busyBy={};list.forEach((b,i)=>busyBy[b.id]=res[i]);render()}}catch(e){msg="Erro ao carregar horários. Tente de novo.";render()}}
function render(){const a=$("#app"),M=msg?`<p class=er>${esc(msg)}</p>`:"";
if(st==0){a.innerHTML=`<p class=mu>${msg?esc(msg):"Carregando…"}</p>`}
else if(st==6){a.innerHTML=`<h2>Escolha o profissional</h2><div class=pgrid><button class="pc ${BSEL==null?"on":""}" data-b=any><span class="av any">★</span>Sem preferência</button>${PR.map(b=>`<button class="pc ${BSEL===b.id?"on":""}" data-b=${b.id}><span class=av>${esc((b.name||"?").trim()[0].toUpperCase())}</span>${esc(b.name.split(" ")[0])}</button>`).join("")}</div><p class=mu style="margin-top:12px">${BSEL==null?"Você será atendido pelo primeiro profissional disponível no horário escolhido.":"Só aparecerão os horários deste profissional."}</p><div class=bar><div></div><button class=go id=n6>Continuar</button></div>`}
else if(st==1){a.innerHTML=(PR.length>1?`<button class=lnk id=b6>← Profissional</button>`:"")+"<h2>Escolha os serviços</h2>"+
SV.map((s,i)=>!vis(s)?"":`<div class=row><div><b>${esc(s.name)}</b><div class=mu>${fm(s.price)}</div></div><div class=st><button data-i=${i} data-d=-1>−</button><span>${q[i]}</span><button data-i=${i} data-d=1>+</button></div></div>`).join("")+
`<div class=bar><div>${items()?items()+" item(ns) · "+fm(total()):"Nenhum serviço"}</div><button class=go id=n1 ${items()?"":"disabled"}>Continuar</button></div>`}
else if(st==2){const sl=date?slots(date):[];
a.innerHTML=`<button class=lnk id=b1>← Serviços</button><h2>Escolha o dia</h2><div class=chips>${days().map(d=>`<button class="chip ${date&&key(d)==key(date)?"on":""}" data-date="${key(d)}">${lab(d)}</button>`).join("")}</div>`+M+
(date?`<h2>Horário</h2>`+(sl.length?`<div class=chips>${sl.map(t=>`<button class="chip ${t===time?"on":""}" data-t=${t}>${hm(t)}</button>`).join("")}</div>`:"<p class=mu>Sem horários livres neste dia. Tente outro.</p>"):"")+
`<div class=bar><div>${time!=null?lab(date)+" às "+hm(time):"Escolha dia e horário"}</div><button class=go id=n2 ${time!=null?"":"disabled"}>Continuar</button></div>`}
else if(st==3){const kn=who.kn&&who.knp===who.p?who.kn:null;a.innerHTML=`<button class=lnk id=b2>← Horário</button><h2>Seus dados</h2><p class=mu>Informe primeiro o seu WhatsApp.</p><input id=ph placeholder="WhatsApp (com DDD)" inputmode=tel value="${esc(who.p||"")}" autocomplete=tel>
<div id=kn class=sum style="margin:6px 0;${kn?"":"display:none"}">Olá, <b id=knn>${kn?esc(kn):""}</b>! Já temos o seu cadastro.</div>
<div id=nw style="${kn?"display:none":""}"><input id=nm placeholder="Nome e sobrenome" value="${esc(kn?"":(who.n||""))}" autocomplete=name></div>
<div id=bw style="${kn?"display:none":""}"><p class=mu style="margin-top:8px">Data de nascimento (só no primeiro agendamento)</p><input id=bd type=date value="${esc(who.b||"")}" max="${key(new Date())}"></div>
<p class=mu>Usamos seus dados só para agendamento e mensagens da barbearia.</p><p id=er class=er></p>
<div class=sum><b>${lab(date)} às ${hm(time)}</b> · com ${BSEL==null?"o primeiro profissional livre":esc(PR.find(x=>x.id===BSEL)?.name||BR.name)}<br>${SV.map((s,i)=>q[i]?s.name+" x"+q[i]:"").filter(Boolean).map(esc).join(", ")}${cdisc()?`<br>Combo ${esc(combo().name)}: − ${fm(cdisc())}`:""}<br><b>Total: ${fm(total())}</b></div>
<div class=bar><div></div><button class=go id=n3>Confirmar agendamento</button></div>`}
else if(st==4){const ph=who.p.length>=12?who.p:"55"+who.p,tx=`Barbershop Js: pedido de horário enviado (aguardando confirmação), ${lab(date)} às ${hm(time)}. Para cancelar, use o código ${res.code} (até 2h antes).`;
a.innerHTML=`<span class=pill>Aguardando confirmação${res.barber_name?" de "+esc(res.barber_name.split(" ")[0]):""}</span><h2 style="margin-top:12px">Pedido enviado!</h2><div class=sum><b>${esc(who.n)}</b>, seu horário está reservado para <b>${lab(date)} às ${hm(time)}</b>, com ${esc(res.barber_name||BR.name)}.<br>Total: ${fm(res.total)}<br>Av. Alto da Serra, 604, Monte Sião – MG<p class=mu style="margin-top:12px">Seu código de cancelamento:</p><div class=code>${esc(res.code)}</div><p class=mu>Guarde este código. Você vai precisar dele para cancelar.</p></div>
<a class=go target=_blank rel=noopener href="https://wa.me/${ph}?text=${encodeURIComponent(tx)}">Enviar para o meu WhatsApp</a><p><button class=lnk id=again>Fazer outro agendamento</button></p>`}
else{a.innerHTML=`<button class=lnk id=b0>← Voltar</button><h2>Cancelar horário</h2><p class=mu>Informe o WhatsApp e o código que você recebeu ao agendar.</p><input id=ph2 placeholder="WhatsApp (com DDD)" inputmode=tel value="${esc(who.p||"")}"><input id=cd placeholder="Código (ex.: K7M2QX)" value="${esc(who.c||"")}" autocapitalize=characters><button class=go id=find>Buscar</button>${M}`+
(cres?(()=>{const d=pd(cres.date);return `<div class=sum><b>${lab(d)} às ${hm(cres.start_min)}</b><br>${cres.services.map(s=>esc(s.name)+" x"+s.qty).join(", ")}<br><br>`+(cres.can_cancel?`<button class=go data-c=1>Cancelar este horário</button>`:`<span class=mu>Cancelamento só até 2h antes. Fale direto com a barbearia.</span>`)+"</div>"})():"")}}
async function book(){const p=$("#ph").value.replace(/\D/g,""),kn=who.kn&&who.knp===p?who.kn:null,n=kn||$("#nm").value.trim().replace(/\s+/g," "),bd=$("#bd").value,bv=!kn,er=m=>{$("#er").textContent=m};who={n,p,b:bd,kn:who.kn,knp:who.knp};
if(p.length<10){er(ER.dados_invalidos);return}
if(!kn&&n.split(" ").filter(x=>x.length>1).length<2){er(ER.nome_completo);return}
if(bv&&!bd){er(ER.precisa_nascimento);return}
$("#n3").disabled=true;
try{const r=await rpc("create_booking",{p_name:n,p_phone:p,p_birth:bv&&bd?bd:null,p_date:key(date),p_start:time,p_items:SV.map((s,i)=>({id:s.id,qty:q[i]})).filter(x=>x.qty),p_barber:BSEL});
if(r.ok){if(r.id){fetch("https://esuvgaijkahzoctyyawe.supabase.co/functions/v1/booking-push",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({action:"notify_booking",booking_id:r.id})}).catch(()=>{})}res=r;st=4;render();window.scrollTo(0,0);return}
if(r.error=="horario_ocupado"||r.error=="horario_invalido"){st=2;time=null;msg=ER[r.error];render();loadBusy();return}
if(r.error=="precisa_nascimento"){$("#bw").style.display="block";$("#nw").style.display="block";$("#kn").style.display="none";who.kn=null}
er(ER[r.error]||"Não foi possível agendar.")}catch(e){er("Erro de conexão. Tente de novo.")}
$("#n3").disabled=false}
async function find(){const p=$("#ph2").value.replace(/\D/g,""),c=$("#cd").value.trim().toUpperCase();who={p,c};cres=null;
if(p.length<10||c.length<4){msg="Informe o WhatsApp e o código.";render();return}
try{const r=await rpc("find_booking",{p_phone:p,p_code:c});cres=r[0]||null;msg=r[0]?"":"Nenhum horário encontrado com esses dados."}catch(e){msg="Erro de conexão."}render()}
async function cancel(){try{const r=await rpc("cancel_booking",{p_id:cres.id,p_phone:who.p,p_code:who.c});if(r.ok){cres=null;who={};msg="Horário cancelado. ✅"}else msg=r.error=="prazo_encerrado"?"Prazo de cancelamento encerrado. Fale com o barbeiro.":"Não foi possível cancelar."}catch(e){msg="Erro de conexão."}render()}
document.addEventListener("input",async e=>{if(e.target.id!="ph")return;const p=e.target.value.replace(/\D/g,"");who.p=p;const show=(k)=>{who.kn=k;who.knp=k?p:null;$("#kn").style.display=k?"block":"none";$("#nw").style.display=k?"none":"block";$("#bw").style.display=k?"none":"block";if(k)$("#knn").textContent=k};if(p.length<10){show(null);return}try{const k=await rpc("client_lookup",{p_phone:p});if($("#ph").value.replace(/\D/g,"")!==p)return;show(k&&k.known?k.name:null)}catch(x){}});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const p=st;msg="";
if(t.dataset.i!=null){const i=+t.dataset.i;q[i]=Math.max(0,Math.min(9,q[i]+ +t.dataset.d));time=null}
else if(t.dataset.date){date=pd(t.dataset.date);time=null;busyBy={};render();await loadBusy();return}
else if(t.dataset.t){time=+t.dataset.t}
else if(t.dataset.b){BSEL=t.dataset.b=="any"?null:Number(t.dataset.b);q=q.map(()=>0);date=null;time=null;busyBy={}}
else if(t.id=="n6"){st=1}
else if(t.id=="b6"){st=6}
else if(t.id=="n1"){st=2;time=null}
else if(t.id=="b1"||t.id=="b0"){st=1}
else if(t.id=="n2"){st=3}
else if(t.id=="b2"){st=2}
else if(t.id=="n3"){await book();return}
else if(t.id=="again"){q=q.map(()=>0);date=null;time=null;res=null;st=PR.length>1?6:1}
else if(t.id=="mine"){who={};cres=null;st=5}
else if(t.id=="find"){await find();return}
else if(t.dataset.c){await cancel();return}
else return;
render();if(p!==st)window.scrollTo(0,0)});
(async()=>{try{const[s,h,b,setting,bsr]=await Promise.all([get("services?select=id,name,price,is_cut&active=eq.true&order=sort"),get("business_hour_periods?select=id,start_date,end_date,active,schedule&active=eq.true&order=start_date.desc"),get("barbers?select=id,name,schedule&active=eq.true&order=id"),get("business_hour_settings?select=slot_step_minutes&id=eq.true"),get("barber_services?select=barber_id,service_id").catch(()=>[])]);BS=bsr||[];SV=s;q=s.map(()=>0);H=h;slotStep=Math.max(5,Number(setting?.[0]?.slot_step_minutes||30));try{CB=await rpc("public_combos",{})}catch(_){CB=[]}try{const old=await get("business_hours?select=*");old.forEach(x=>LEGACY[x.weekday]=x)}catch(_){}PR=b||[];if(PR[0])BR=PR[0];if(PR.length===1)BSEL=PR[0].id;st=PR.length>1?6:1}catch(e){msg="Não foi possível carregar. Tente novamente em instantes."}render()})();
</script></body></html>
