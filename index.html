<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="theme-color" content="#1B1A18"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbershop Js – Agendamento</title>
<style>
:root{--bg:#F6F1E9;--card:#fff;--tx:#1B1A18;--mu:#5E574E;--ac:#1B1A18;--on:#F6F1E9;--bd:#E4DBCD;--gold:#B8863B;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:#1B1A18;color:#F6F1E9;border-bottom:4px solid var(--gold)}
.hd{display:flex;gap:14px;align-items:center;max-width:480px;margin:0 auto;padding:24px 16px}
.logo{width:72px;height:72px;border-radius:50%;background:#fff;flex:none;object-fit:cover;border:2px solid #F6F1E9}
.hd a{display:block;margin-top:4px;text-decoration:none;color:#D9CFBF;font-size:13px;line-height:1.35}
h1{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:32px;line-height:1;margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}
h2{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:27px;line-height:1.1;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.3px}
main{max-width:480px;margin:0 auto;padding:6px 16px 120px}
.hd .mu{color:#D9CFBF}
.mu{color:var(--mu);font-size:14px;margin:0}.er{color:#B3342B;font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.st{display:flex;align-items:center;gap:12px}.st span{min-width:16px;text-align:center;font-weight:600}
.st button{width:40px;height:40px;border-radius:50%;border:1px solid #CFC4B2;background:var(--bg);color:var(--tx);font-size:20px}
.st button[data-d="1"]{background:#1B1A18;border-color:#1B1A18;color:#F6F1E9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;min-height:44px;border-radius:12px;border:1px solid #CFC4B2;background:var(--card);color:var(--tx);font-size:15px;font-weight:500}
.chip.on{background:#1B1A18;color:#F6F1E9;border-color:#1B1A18}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar div{font-size:14px}
.go{display:inline-block;text-decoration:none;text-align:center;background:#1B1A18;color:#F6F1E9;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:600}
a.go{background:#1F7A4A;color:#fff;display:block;margin-top:12px}
.go:disabled{opacity:.35}
.lnk{background:none;border:0;color:#7A5416;padding:10px 0;min-height:44px;font-size:14px;font-weight:600}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #CFC4B2;background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
input:focus{outline:2px solid #B8863B88;border-color:var(--gold)}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.code{background:#1B1A18;color:#E3B566;border-radius:14px;padding:10px;text-align:center;font-family:"Barlow Condensed",Inter,sans-serif;font-size:46px;font-weight:700;letter-spacing:8px;margin:8px 0}
.pill{display:inline-block;background:#FFF1D6;color:#7A4B00;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body><div class="top"><header class="hd"><img class="logo" alt="Logo Barbershop Js" src="logo.jpg" onerror="this.style.display='none'"><div><h1>Barbershop Js</h1><p class="mu">Barbeiro: Josué</p><a class="mu" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Avenida+Alto+da+Serra+604+Alto+da+Serra+Monte+Si%C3%A3o+MG">📍 Av. Alto da Serra, 604 · Alto da Serra<br>Monte Sião – MG</a></div></header>
</div><main>
<p class="mu" style="margin-top:12px">Agende seu horário, rápido e sem cadastro.</p>
<button class="lnk" id="mine">Já tenho horário / cancelar →</button>
<div id="app"></div>
</main>
<script>
const SB="https://esuvgaijkahzoctyyawe.supabase.co",KEY="sb_publishable_bC-fW9ei_xw9ovFzPJE7cA_Fkd8QSsz";
const $=s=>document.querySelector(s);
const hd={apikey:KEY,"Content-Type":"application/json"};
const rpc=(f,b)=>fetch(SB+"/rest/v1/rpc/"+f,{method:"POST",headers:hd,body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0;return r.json()});
const get=p=>fetch(SB+"/rest/v1/"+p,{headers:hd}).then(r=>{if(!r.ok)throw 0;return r.json()});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ER={dados_invalidos:"Confira seu nome e WhatsApp (com DDD).",nascimento_invalido:"Data de nascimento inválida.",precisa_nascimento:"Informe sua data de nascimento.",horario_invalido:"Horário indisponível. Escolha outro.",horario_ocupado:"Esse horário acabou de ser ocupado. Escolha outro."};
const DW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
let SV=[],H=[],LEGACY={},BR={id:1,name:"Josué"},q=[],st=0,date=null,time=null,busy=[],who={},res=null,cres=null,msg="",slotStep=30;
const fm=n=>"R$ "+Number(n).toFixed(2).replace(".",",");
const cuts=()=>SV.reduce((a,s,i)=>a+(s.is_cut?q[i]:0),0);
const dur=()=>30*Math.max(1,cuts());
const total=()=>SV.reduce((a,s,i)=>a+s.price*q[i],0);
const items=()=>q.reduce((a,b)=>a+b,0);
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const lab=d=>DW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
const pd=s=>{const [y,m,d]=s.split("-");return new Date(+y,m-1,+d)};
const activePeriod=d=>H.filter(p=>p.active&&p.start_date<=key(d)&&(!p.end_date||p.end_date>=key(d))).sort((a,b)=>b.start_date.localeCompare(a.start_date)||b.id-a.id)[0]||null;
const intervals=d=>{const p=activePeriod(d);if(p){const v=p.schedule?.[String(d.getDay())];return Array.isArray(v)?v:[]}const o=LEGACY[d.getDay()];if(!o||o.open_min==null)return [];const out=[];if(o.lunch_start!=null&&o.lunch_end!=null&&o.lunch_end>o.lunch_start){out.push({start_min:o.open_min,end_min:o.lunch_start},{start_min:o.lunch_end,end_min:o.close_min})}else out.push({start_min:o.open_min,end_min:o.close_min});return out};
const open=d=>intervals(d).length>0;
function days(){const r=[],n=new Date();for(let i=0;r.length<14&&i<40;i++){const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(open(x))r.push(x)}return r}
function slots(d){const ranges=intervals(d),n=dur(),now=new Date(),td=key(now)==key(d),nm=now.getHours()*60+now.getMinutes(),r=[];for(const o of ranges){for(let t=Number(o.start_min);t+n<=Number(o.end_min);t+=slotStep){if(busy.some(x=>t<x.end_min&&t+n>x.start_min))continue;if(td&&t<=nm)continue;r.push(t)}}return r}
async function loadBusy(){const d=date;try{const b=await rpc("get_busy",{p_date:key(d),p_barber:BR.id});if(date===d){busy=b;render()}}catch(e){msg="Erro ao carregar horários. Tente de novo.";render()}}
function render(){const a=$("#app"),M=msg?`<p class=er>${esc(msg)}</p>`:"";
if(st==0){a.innerHTML=`<p class=mu>${msg?esc(msg):"Carregando…"}</p>`}
else if(st==1){a.innerHTML="<h2>Escolha os serviços</h2><p class=mu>Cada corte adicional soma 30 min (uma pessoa a mais).</p>"+
SV.map((s,i)=>`<div class=row><div><b>${esc(s.name)}</b><div class=mu>${fm(s.price)}</div></div><div class=st><button data-i=${i} data-d=-1>−</button><span>${q[i]}</span><button data-i=${i} data-d=1>+</button></div></div>`).join("")+
`<div class=bar><div>${items()?items()+" item(ns) · "+fm(total())+"<br>"+dur()+" min":"Nenhum serviço"}</div><button class=go id=n1 ${items()?"":"disabled"}>Continuar</button></div>`}
else if(st==2){const sl=date?slots(date):[];
a.innerHTML=`<button class=lnk id=b1>← Serviços</button><h2>Escolha o dia</h2><div class=chips>${days().map(d=>`<button class="chip ${date&&key(d)==key(date)?"on":""}" data-date="${key(d)}">${lab(d)}</button>`).join("")}</div>`+M+
(date?`<h2>Horário (${dur()} min)</h2>`+(sl.length?`<div class=chips>${sl.map(t=>`<button class="chip ${t===time?"on":""}" data-t=${t}>${hm(t)}</button>`).join("")}</div>`:"<p class=mu>Sem horários livres neste dia. Tente outro.</p>"):"")+
`<div class=bar><div>${time!=null?lab(date)+" às "+hm(time):"Escolha dia e horário"}</div><button class=go id=n2 ${time!=null?"":"disabled"}>Continuar</button></div>`}
else if(st==3){a.innerHTML=`<button class=lnk id=b2>← Horário</button><h2>Seus dados</h2><input id=nm placeholder="Seu nome" value="${esc(who.n||"")}" autocomplete=name><input id=ph placeholder="WhatsApp (com DDD)" inputmode=tel value="${esc(who.p||"")}" autocomplete=tel>
<div id=bw><p class=mu style="margin-top:8px">Data de nascimento (só no primeiro agendamento)</p><input id=bd type=date value="${esc(who.b||"")}" max="${key(new Date())}"></div>
<p class=mu>Usamos seus dados só para agendamento e mensagens da barbearia.</p><p id=er class=er></p>
<div class=sum><b>${lab(date)} às ${hm(time)}</b> (${dur()} min) · com ${esc(BR.name)}<br>${SV.map((s,i)=>q[i]?s.name+" x"+q[i]:"").filter(Boolean).map(esc).join(", ")}<br><b>Total: ${fm(total())}</b></div>
<div class=bar><div></div><button class=go id=n3>Confirmar agendamento</button></div>`}
else if(st==4){const ph=who.p.length>=12?who.p:"55"+who.p,tx=`Barbershop Js: pedido de horário enviado (aguardando confirmação), ${lab(date)} às ${hm(time)}. Para cancelar, use o código ${res.code} (até 2h antes).`;
a.innerHTML=`<span class=pill>Aguardando confirmação do Josué</span><h2 style="margin-top:12px">Pedido enviado!</h2><div class=sum><b>${esc(who.n)}</b>, seu horário está reservado para <b>${lab(date)} às ${hm(time)}</b>, com ${esc(BR.name)}.<br>Total: ${fm(res.total)}<br>Av. Alto da Serra, 604, Monte Sião – MG<p class=mu style="margin-top:12px">Seu código de cancelamento:</p><div class=code>${esc(res.code)}</div><p class=mu>Guarde este código. Você vai precisar dele para cancelar.</p></div>
<a class=go target=_blank rel=noopener href="https://wa.me/${ph}?text=${encodeURIComponent(tx)}">Enviar para o meu WhatsApp</a><p><button class=lnk id=again>Fazer outro agendamento</button></p>`}
else{a.innerHTML=`<button class=lnk id=b0>← Voltar</button><h2>Cancelar horário</h2><p class=mu>Informe o WhatsApp e o código que você recebeu ao agendar.</p><input id=ph2 placeholder="WhatsApp (com DDD)" inputmode=tel value="${esc(who.p||"")}"><input id=cd placeholder="Código (ex.: K7M2QX)" value="${esc(who.c||"")}" autocapitalize=characters><button class=go id=find>Buscar</button>${M}`+
(cres?(()=>{const d=pd(cres.date);return `<div class=sum><b>${lab(d)} às ${hm(cres.start_min)}</b> (${cres.end_min-cres.start_min} min)<br>${cres.services.map(s=>esc(s.name)+" x"+s.qty).join(", ")}<br><br>`+(cres.can_cancel?`<button class=go data-c=1>Cancelar este horário</button>`:`<span class=mu>Cancelamento só até 2h antes. Fale direto com o barbeiro ${esc(BR.name)}.</span>`)+"</div>"})():"")}}
async function book(){const n=$("#nm").value.trim(),p=$("#ph").value.replace(/\D/g,""),bd=$("#bd").value,bv=$("#bw").style.display!="none",er=m=>{$("#er").textContent=m};who={n,p,b:bd};
if(n.length<2||p.length<10){er(ER.dados_invalidos);return}
if(bv&&!bd){er(ER.precisa_nascimento);return}
$("#n3").disabled=true;
try{const r=await rpc("create_booking",{p_name:n,p_phone:p,p_birth:bv&&bd?bd:null,p_date:key(date),p_start:time,p_items:SV.map((s,i)=>({id:s.id,qty:q[i]})).filter(x=>x.qty)});
if(r.ok){if(r.id){fetch("https://esuvgaijkahzoctyyawe.supabase.co/functions/v1/booking-push",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({action:"notify_booking",booking_id:r.id})}).catch(()=>{})}res=r;st=4;render();window.scrollTo(0,0);return}
if(r.error=="horario_ocupado"||r.error=="horario_invalido"){st=2;time=null;msg=ER[r.error];render();loadBusy();return}
if(r.error=="precisa_nascimento")$("#bw").style.display="block";
er(ER[r.error]||"Não foi possível agendar.")}catch(e){er("Erro de conexão. Tente de novo.")}
$("#n3").disabled=false}
async function find(){const p=$("#ph2").value.replace(/\D/g,""),c=$("#cd").value.trim().toUpperCase();who={p,c};cres=null;
if(p.length<10||c.length<4){msg="Informe o WhatsApp e o código.";render();return}
try{const r=await rpc("find_booking",{p_phone:p,p_code:c});cres=r[0]||null;msg=r[0]?"":"Nenhum horário encontrado com esses dados."}catch(e){msg="Erro de conexão."}render()}
async function cancel(){try{const r=await rpc("cancel_booking",{p_id:cres.id,p_phone:who.p,p_code:who.c});if(r.ok){cres=null;who={};msg="Horário cancelado. ✅"}else msg=r.error=="prazo_encerrado"?"Prazo de cancelamento encerrado. Fale com o barbeiro.":"Não foi possível cancelar."}catch(e){msg="Erro de conexão."}render()}
document.addEventListener("input",async e=>{if(e.target.id!="ph")return;const p=e.target.value.replace(/\D/g,"");if(p.length<10)return;try{const k=await rpc("client_known",{p_phone:p});$("#bw").style.display=k?"none":"block"}catch(x){}});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const p=st;msg="";
if(t.dataset.i!=null){const i=+t.dataset.i;q[i]=Math.max(0,Math.min(9,q[i]+ +t.dataset.d));time=null}
else if(t.dataset.date){date=pd(t.dataset.date);time=null;busy=[];render();await loadBusy();return}
else if(t.dataset.t){time=+t.dataset.t}
else if(t.id=="n1"){st=2;time=null}
else if(t.id=="b1"||t.id=="b0"){st=1}
else if(t.id=="n2"){st=3}
else if(t.id=="b2"){st=2}
else if(t.id=="n3"){await book();return}
else if(t.id=="again"){q=q.map(()=>0);date=null;time=null;res=null;st=1}
else if(t.id=="mine"){who={};cres=null;st=5}
else if(t.id=="find"){await find();return}
else if(t.dataset.c){await cancel();return}
else return;
render();if(p!==st)window.scrollTo(0,0)});
(async()=>{try{const[s,h,b,setting]=await Promise.all([get("services?select=id,name,price,is_cut&active=eq.true&order=sort"),get("business_hour_periods?select=id,start_date,end_date,active,schedule&active=eq.true&order=start_date.desc"),get("barbers?select=id,name&active=eq.true&order=id&limit=1"),get("business_hour_settings?select=slot_step_minutes&id=eq.true")]);SV=s;q=s.map(()=>0);H=h;slotStep=Math.max(5,Number(setting?.[0]?.slot_step_minutes||30));try{const old=await get("business_hours?select=*");old.forEach(x=>LEGACY[x.weekday]=x)}catch(_){}if(b[0])BR=b[0];st=1}catch(e){msg="Não foi possível carregar. Tente novamente em instantes."}render()})();
</script></body></html>
